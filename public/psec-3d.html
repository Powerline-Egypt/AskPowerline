<!doctype html>
<html lang="en">
<head>
<style id="pl-viewer-mode">
  html, body { background:#ffffff !important; overflow:hidden !important; }
  #app { display:block !important; background:#ffffff !important; }
  /* hide every bit of chrome: top bar, both side panels, the learn/operate tabs */
  #app > header, #app > aside, #app > nav, nav.tabs, #tabs { display:none !important; }
  /* the 3D view fills the frame; keep only its canvas, drop in-view overlays */
  #app > main#view {
    position:fixed !important; inset:0 !important;
    width:100vw !important; height:100vh !important;
    background:#ffffff !important;
  }
  #view > *:not(canvas#c) { display:none !important; }
  #view canvas#c {
    pointer-events:auto !important; cursor:grab; touch-action:none;
    width:100vw !important; height:100vh !important;
  }
  #view canvas#c:active { cursor:grabbing; }
  #leaders, #labels, #bline, #btag, #tip, #toast, #blockBanner,
  #titleblock, .titleblock, .hint2, .loading { display:none !important; }

  /* "Drag to rotate" hint — top, dark/orange pill, animated icon */
  #pl-hint {
    position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:60;
    display:flex; align-items:center; gap:8px;
    font:700 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
    letter-spacing:0.12em; text-transform:uppercase; color:#fff;
    background:rgba(12,12,14,0.82); border:1px solid rgba(232,114,42,0.45);
    border-radius:999px; padding:9px 15px 9px 12px;
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    pointer-events:none; white-space:nowrap;
    animation:plHintIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    transition:opacity 0.55s ease, transform 0.55s ease;
  }
  #pl-hint.hide { opacity:0; transform:translateX(-50%) translateY(-10px); }
  #pl-hint svg { color:#e8722a; display:block; animation:plHintNudge 2.6s ease-in-out infinite; }
  @keyframes plHintIn { from { opacity:0; transform:translateX(-50%) translateY(-12px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes plHintNudge { 0%,100% { transform:rotate(0deg); } 28% { transform:rotate(-26deg); } 72% { transform:rotate(26deg); } }
  @media (prefers-reduced-motion: reduce) { #pl-hint, #pl-hint svg { animation:none !important; } }
</style>

:root {
  --orange: #E85C1A; --carbon: #111111; --charcoal: #3A3A3A; --grey: #CCCCCC;
  --bg: #F4F4F4; --card: #FFFFFF; --stage: #F2F2F1;
  --line: rgba(17,17,17,.10); --line2: rgba(17,17,17,.20); --muted: rgba(58,58,58,.74); --soft: #F6F6F5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--charcoal); font-family: Archivo, Arial, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .22em; color: var(--charcoal); line-height: 1.4; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-weight: 700; }
.mut { color: var(--muted); font-weight: 400; }
.mt { margin-top: 18px; }

#app { display: grid; height: 100vh; grid-template-columns: 292px minmax(0, 1fr) 384px; grid-template-rows: 64px minmax(0, 1fr); grid-template-areas: "head head head" "left view right"; }

/* header */
header.top { grid-area: head; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
.brand { padding: 17px 18px 17px 0; border-right: 1px solid var(--line); flex: none; }
.brand img { height: 30px; width: auto; display: block; }
.ttl { min-width: 0; }
.ttl h1 { margin: 2px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: var(--carbon); line-height: 1.1; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: #fff; border: 1px solid var(--line2); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 13px; color: var(--charcoal); white-space: nowrap; }
.seg button:hover { background: var(--soft); }
.seg button.on { background: var(--carbon); color: #fff; }
.seg.sm button { padding: 5px 11px; font-size: 12.5px; }
.plg { position: relative; display: flex; align-items: center; gap: 12px; }
.code { border: 1px solid var(--line2); background: #fff; padding: 5px 12px; border-radius: 6px; font-weight: 800; font-size: 18px; letter-spacing: .04em; color: var(--carbon); font-variant-numeric: tabular-nums; display: inline-flex; gap: 0; }
.code:hover { border-color: var(--carbon); }
.code .cs.kv, .code .cs.n { color: var(--orange); }
.code .cs.cb { color: var(--charcoal); }
.code .cs.l { color: var(--muted); }
.code .cs + .cs { margin-left: 3px; }
.code .cs.l + .cs.l { margin-left: 1px; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 360px; background: #fff; border: 1px solid var(--line2); border-radius: 8px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(17,17,17,.12); z-index: 30; }
.pop .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 16px; color: var(--carbon); }
.pop .iname { margin-top: 10px; }

/* side panels */
aside { background: #fff; min-height: 0; }
aside.left { grid-area: left; border-right: 1px solid var(--line); overflow: auto; padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
aside.right { grid-area: right; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.hint b { color: var(--carbon); }
.stepnum { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: 0; line-height: 1; }
.stephead { display: flex; gap: 10px; align-items: center; padding: 2px 2px 2px; }
.stephead b { flex: 1; font-size: 15.5px; font-weight: 700; color: var(--carbon); letter-spacing: -0.01em; line-height: 1.25; }
/* builder: one white card per group, clear gaps between them */
.bcard { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 12px; }
.bhead { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--carbon); line-height: 1.2; }
.bhead::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--orange); flex: none; }
.bhead .link { margin-left: auto; letter-spacing: 0; text-transform: none; font-size: 12.5px; }
.bcard .brow { min-height: 40px; padding: 3px 0; }
.bcard .brow:last-child { border-bottom: 0; padding-bottom: 0; min-height: 37px; }
.bcard .brow:first-of-type { padding-top: 0; min-height: 37px; }
.seg.full { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.seg.full button { padding: 7px 10px; font-size: 13px; }
.rec { display: block; width: fit-content; margin-top: 3px; font-size: 8.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); border: 1px solid var(--orange); border-radius: 999px; padding: 1px 6px; line-height: 1.4; white-space: nowrap; }
.codecard { container-type: inline-size; }
.codeline { display: flex; flex-wrap: wrap; gap: 0 .3em; font-size: 14px; font-size: clamp(12px, 6.5cqi, 16px); font-weight: 800; letter-spacing: .02em; color: var(--carbon); font-variant-numeric: tabular-nums; line-height: 1.3; }
.codeline .cs { white-space: nowrap; }
.codeline .cs.kv, .codeline .cs.n { color: var(--orange); }
.codeline .cs.l { color: var(--muted); }
.codecard .codeform { margin-top: 11px; }
.codecard .codeform input { font-size: 12.5px; letter-spacing: .02em; }
.codecard .codeform input::placeholder { text-transform: none; letter-spacing: 0; }
/* builder */
.builder { display: flex; flex-direction: column; gap: 10px; }
.brow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.brow .bl { min-width: 0; font-weight: 600; font-size: 13.5px; color: var(--carbon); line-height: 1.25; }
.stp { display: inline-flex; align-items: stretch; flex: none; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: #fff; }
.stp button { width: 32px; height: 30px; border: 0; background: #fff; font-size: 18px; line-height: 1; color: var(--carbon); padding: 0; }
.stp button:hover:not([disabled]) { background: var(--soft); }
.stp button:focus-visible { outline-offset: -2px; }
.stp button[disabled] { color: var(--grey); cursor: default; }
.stp output { min-width: 36px; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--carbon); font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.sw { position: relative; flex: none; width: 42px; height: 24px; border: 0; border-radius: 999px; background: #C9C9C7; padding: 0; transition: background .15s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(17,17,17,.3); transition: transform .15s; }
.sw.on { background: var(--orange); }
.sw.on i { transform: translateX(18px); }
.sw[disabled] { opacity: .4; cursor: default; }
.brow.col { flex-direction: column; align-items: stretch; gap: 7px; padding: 8px 0 10px; }
.cbopts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cbopt { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; min-width: 0; min-height: 50px; padding: 7px 10px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; text-align: left; line-height: 1.2; }
.cbopt b { font-size: 13px; font-weight: 700; color: var(--carbon); }
.cbopt:hover { border-color: var(--carbon); }
.cbopt.on { background: var(--carbon); border-color: var(--carbon); }
.cbopt.on b { color: #fff; }
.cbopt.on small { color: rgba(255,255,255,.72); }
.cbopt.soon { background: var(--soft); border-style: dashed; cursor: not-allowed; }
.cbopt.soon:hover { border-color: var(--line2); }
.cbopt.soon b { color: rgba(58,58,58,.55); }
.soonpill { font-size: 8.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); background: #fff; border: 1px solid var(--orange); border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
.err .link { display: inline; margin-top: 4px; font-size: 12.5px; text-align: left; }
/* the code */
.codeview { display: flex; gap: 2px; margin-top: 8px; }
.codeview .cs { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 5px 2px 3px; border-radius: 4px; background: var(--soft); border-top: 3px solid var(--grey); }
.codeview .cs b { font-size: 15px; font-weight: 800; line-height: 1.15; color: var(--carbon); letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.codeview .cs i { font-style: normal; font-size: 8px; font-weight: 600; letter-spacing: .08em; color: var(--muted); line-height: 1.5; white-space: nowrap; }
.codeview .cs.pre { border-top-color: var(--carbon); }
.codeview .cs.kv, .codeview .cs.n { border-top-color: var(--orange); }
.codeview .cs.cb { border-top-color: var(--charcoal); }
.codeview .cs.l b { color: var(--charcoal); }
.codeview.big { gap: 3px; margin: 4px 0 10px; }
.codeview.big .cs { padding: 7px 2px 4px; }
.codeview.big .cs b { font-size: 18px; }
.codeview.big .cs i { font-size: 8.5px; }
.iname { margin: 8px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--carbon); font-weight: 600; }
.iname span { display: block; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
label.lbl { display: block; }
.codeform { display: flex; gap: 6px; margin-top: 6px; }
.codeform input { flex: 1; min-width: 0; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--carbon); text-transform: uppercase; background: #fff; }
.codeform input::placeholder { font-weight: 400; color: rgba(58,58,58,.45); }
.codeform input:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
.codeform input[aria-invalid="true"] { border-color: var(--orange); }
.err { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; color: #B23C04; font-weight: 600; }
.err[hidden] { display: none; }
/* line-up strip */

/* tables + cards */
table.spec { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.spec th { text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--charcoal); padding: 8px 0 6px; border-bottom: 1.5px solid var(--carbon); }
table.spec th.cur { color: var(--orange); }
table.spec td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.spec td:first-child { color: var(--muted); padding-right: 12px; width: 46%; }
table.spec td.v { color: var(--carbon); font-weight: 600; }
table.spec.cmp td:first-child { width: 36%; }
table.spec.cmp td.v { padding-right: 8px; }
table.spec td.dim { color: var(--muted); font-weight: 400; }
table.spec.dec td:first-child { width: 22%; font-weight: 700; color: var(--carbon); }
.src { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 12px 0 9px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .22em; border-bottom: 3px solid transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
.tabs .stepnum { width: 20px; height: 20px; font-size: 11px; background: #C9C9C7; }
.tabs button.on .stepnum { background: var(--orange); }
.tabs button:hover { color: var(--carbon); }
.tabs button.on { color: var(--carbon); border-bottom-color: var(--orange); }
#pane { overflow: auto; padding: 20px 22px 32px; flex: 1; min-height: 0; }
h2.nm { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; color: var(--carbon); margin: 6px 0 14px; line-height: 1.15; }
.ask { font-weight: 300; font-size: 18px; color: var(--charcoal); line-height: 1.3; margin: 0 0 4px; letter-spacing: -0.01em; }
.ans { font-weight: 800; font-size: 18px; color: var(--carbon); line-height: 1.25; letter-spacing: -0.015em; margin: 0 0 10px; }
.track { display: flex; height: 4px; margin: 0 0 14px; }
.track i { flex: 85; background: var(--orange); }
.track i + i { flex: 15; background: var(--grey); }
#pane.anim .track i:first-child { animation: trackfill 1.6s cubic-bezier(.25,.7,.2,1) both; }
@keyframes trackfill { from { flex-grow: 0; } to { flex-grow: 85; } }
@media (prefers-reduced-motion: reduce) { #pane.anim .track i:first-child { animation: none; } }
.body { margin: 0 0 14px; }
.badge { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; }
.badge.gen { color: var(--orange); border: 1px solid var(--orange); background: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line2); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--carbon); }
.chip:hover { border-color: var(--carbon); }
.btn { border: 1px solid var(--carbon); background: var(--carbon); color: #fff; padding: 9px 14px; border-radius: 6px; font-weight: 600; font-size: 13.5px; }
.btn:hover:not([disabled]) { background: #000; }
.btn.ghost { background: #fff; color: var(--carbon); }
.btn.ghost:hover:not([disabled]) { background: var(--soft); }
.btn.orange { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.orange:hover:not([disabled]) { background: #cf4f12; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }
.btn[disabled] { opacity: .4; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btnrow.tight { margin-top: 8px; }
.btnrow.nav .btn { flex: 1; }
.link { border: 0; background: none; padding: 0; color: var(--carbon); font-weight: 600; font-size: 12.5px; text-decoration: underline; text-decoration-color: var(--orange); text-underline-offset: 3px; text-decoration-thickness: 2px; }
.tblhead { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
ol.how3 { list-style: none; margin: 2px 0 12px; padding: 0; display: grid; gap: 10px; counter-reset: h; }
ol.how3 li { counter-increment: h; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; }
ol.how3 li::before { content: counter(h); grid-row: span 2; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--carbon); color: #fff; font-weight: 800; font-size: 12px; }
ol.how3 li:first-child::before { background: var(--orange); }
ol.how3 b { color: var(--carbon); font-size: 14px; line-height: 1.3; }
ol.how3 span { font-size: 13px; line-height: 1.4; }
ul.tips { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
ul.tips li { margin: 4px 0; }
ul.tips b { color: var(--carbon); }
.stepbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
.stepbar .nav { display: flex; gap: 6px; flex: none; }
.note { border-left: 3px solid var(--orange); padding: 6px 10px; background: var(--soft); font-size: 13px; }

/* operate */
.field { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.field select { flex: 1; padding: 7px 8px; border: 1px solid var(--line2); border-radius: 6px; background: #fff; font-weight: 600; color: var(--carbon); }
.mimic { width: 100%; height: auto; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; }
.mimic text.mt { font-size: 9px; font-weight: 600; letter-spacing: .14em; fill: var(--charcoal); font-family: Archivo, Arial, sans-serif; }
.mimic text.sm { font-size: 9px; letter-spacing: .08em; }
table.state { margin-top: 0; }
table.state td:first-child { width: 42%; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--carbon); background: #fff; white-space: nowrap; }
.pill.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill.dark { background: var(--charcoal); border-color: var(--charcoal); color: #fff; }
.pill.mid { border-color: var(--orange); color: var(--orange); }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin: 8px 0 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
ol.log { margin: 6px 0 0; padding-left: 20px; font-size: 12.5px; color: var(--muted); }
ol.log li.b { color: var(--orange); }
details.rules { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
details.rules summary { cursor: pointer; list-style: none; }
details.rules summary::after { content: ' +'; font-weight: 300; }
details.rules[open] summary::after { content: ' \2212'; }
details.rules ol { padding-left: 18px; margin: 8px 0 0; font-size: 12.5px; }
details.rules li { margin: 6px 0; }
details.rules li b { display: block; color: var(--carbon); font-weight: 600; }
details.rules li span { color: var(--muted); }

/* learn steps */
.tourcta { position: relative; overflow: hidden; isolation: isolate; display: grid; grid-template-columns: 54px minmax(0, 1fr); align-items: center; gap: 14px; width: 100%; margin: 0; padding: 16px 74px 16px 16px; border: 0; border-radius: 12px; text-align: left; color: #fff; background: linear-gradient(115deg, #E85C1A 0%, #EE6A27 55%, #F4884A 100%); box-shadow: 0 12px 24px -12px rgba(232,92,26,.9), inset 0 1px 0 rgba(255,255,255,.22); transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; }
.tourcta::before { content: ''; position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px); background-size: 14px 14px; -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000 85%); mask-image: linear-gradient(90deg, transparent 30%, #000 85%); }
.tourcta:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -12px rgba(232,92,26,.95), inset 0 1px 0 rgba(255,255,255,.22); }
.tourcta:active { transform: none; filter: brightness(.96); }
.tourcta:focus-visible { outline: 3px solid var(--carbon); outline-offset: 3px; }
.tc-play { position: relative; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(17,17,17,.22); transition: transform .18s ease; }
.tc-play svg { width: 24px; height: 24px; margin-left: 4px; fill: var(--orange); }
.tc-play::after { content: ''; position: absolute; inset: 0; border-radius: 50%; animation: tcRing 2.4s ease-out infinite; }
.tourcta:hover .tc-play { transform: scale(1.06); }
@keyframes tcRing { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 70%, 100% { box-shadow: 0 0 0 16px rgba(255,255,255,0); } }
.tc-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tc-k { font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.88); }
.tc-txt b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; color: #fff; }
.tc-txt small { font-size: 12.5px; line-height: 1.35; color: rgba(255,255,255,.94); }
.tc-art { position: absolute; z-index: -1; right: 12px; top: 50%; height: 104px; width: auto; transform: translateY(-50%); fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .5; transition: transform .25s ease, opacity .25s ease; }
.tc-art .h { stroke-width: 2.6; }
.tourcta:hover .tc-art { transform: translateY(calc(-50% - 3px)); opacity: .65; }
.dots.intro { margin-top: 12px; }
@media (prefers-reduced-motion: reduce) { .tc-play::after { animation: none; } .tourcta, .tc-play, .tc-art { transition: none; } }
.dots { display: flex; gap: 3px; margin: 8px 0 2px; }
.dots button { flex: 1; height: 16px; border: 0; padding: 0; background: transparent; position: relative; border-radius: 2px; }
.dots button::before { content: ''; position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: var(--grey); }
.dots button.done::before { background: var(--charcoal); }
.dots button.on::before { background: var(--orange); top: 5px; height: 6px; }
.dots button:hover::before { background: var(--carbon); }
/* tour beats */
.beats { margin: 0 0 4px; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px 10px 14px; background: #fff; box-shadow: inset 4px 0 0 var(--orange); }
.bt-head { display: flex; align-items: center; gap: 10px; }
.bt-play { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; background: var(--orange); box-shadow: 0 3px 8px rgba(232,92,26,.35); }
.bt-play svg { width: 14px; height: 14px; fill: #fff; }
.bt-play:hover { background: #cf4f12; }
.bt-n { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); font-variant-numeric: tabular-nums; }
.bt-t { font-size: 15.5px; font-weight: 800; color: var(--carbon); letter-spacing: -0.01em; line-height: 1.2; }
.bt-bar { height: 3px; margin: 9px 0 8px; border-radius: 2px; background: #e7e7e5; overflow: hidden; }
.bt-bar i { display: block; height: 100%; width: 0; background: var(--orange); }
.beats.paused .bt-bar i { background: var(--charcoal); }
.bt-text { margin: 0; min-height: 42px; font-size: 14px; line-height: 1.5; color: var(--carbon); }
.bt-dots { display: flex; gap: 2px; margin: 6px 0 -4px -5px; }
.bt-dots button { position: relative; width: 20px; height: 20px; border: 0; padding: 0; background: none; }
.bt-dots button::before { content: ''; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #d3d3d1; transition: background .15s; }
.bt-dots button.done::before { background: var(--charcoal); }
.bt-dots button.on::before { background: var(--orange); box-shadow: 0 0 0 3px rgba(232,92,26,.22); }
.bt-dots button:hover::before { background: var(--carbon); }
.bt-voice { margin-left: auto; flex: none; display: grid; place-items: center; width: 32px; height: 26px; border: 1px solid var(--line2); border-radius: 999px; background: #fff; padding: 0; color: var(--muted); }
.bt-voice svg { width: 16px; height: 16px; fill: currentColor; }
.bt-voice svg .w { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.bt-voice:hover { border-color: var(--carbon); }
.bt-voice.on { border-color: var(--orange); color: var(--orange); }
.bt-voice + .bt-auto { margin-left: 0; }
.bt-auto { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px; background: #fff; padding: 3px 10px 3px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bt-auto::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #c9c9c7; }
.bt-auto:hover { border-color: var(--carbon); }
.bt-auto.on { border-color: var(--orange); color: var(--orange); }
.bt-auto.on::before { background: var(--orange); box-shadow: 0 0 0 3px rgba(232,92,26,.22); }
.bt-t { min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.facts div { background: var(--soft); border-radius: 8px; padding: 8px 9px 7px; min-width: 0; }
.facts b { display: block; font-size: 17px; font-weight: 800; color: var(--carbon); letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; }
.facts b.long { font-size: 14px; line-height: 1.35; }
.facts span { display: block; margin-top: 3px; font-size: 11.5px; line-height: 1.3; color: var(--muted); }
.btn.nudge { animation: nudge 1.5s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,92,26,.55); } 50% { box-shadow: 0 0 0 7px rgba(232,92,26,0); } }
/* pointer label in the 3D view */
.btag { position: absolute; left: 0; top: 0; z-index: 5; max-width: 260px; padding: 7px 12px 8px; border-radius: 8px; border-left: 4px solid var(--orange); background: var(--carbon); color: #fff; box-shadow: 0 8px 22px rgba(17,17,17,.25); pointer-events: none; will-change: transform; }
.btag b { display: block; font-size: 13.5px; font-weight: 800; letter-spacing: -0.005em; line-height: 1.25; }
.btag span { display: block; margin-top: 1px; font-size: 12px; line-height: 1.3; color: rgba(255,255,255,.8); }
.btag.in { animation: btagIn .5s ease-out; }
@keyframes btagIn { from { box-shadow: 0 0 0 6px rgba(232,92,26,.45), 0 8px 22px rgba(17,17,17,.25); } to { box-shadow: 0 0 0 0 rgba(232,92,26,0), 0 8px 22px rgba(17,17,17,.25); } }
#bline { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; overflow: visible; }
#bline line { stroke: var(--orange); stroke-width: 2; }
#bline .d { fill: var(--orange); stroke: #fff; stroke-width: 1.5; }
#bline .r { fill: none; stroke: var(--orange); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.7); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
#labels.dim, #leaders.dim { opacity: .3; transition: opacity .3s; }
#fxChips { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.fxchip { position: absolute; display: flex; align-items: baseline; gap: 6px; padding: 3px 9px; border-radius: 6px; background: var(--orange); color: #fff; transform: translate(-50%, -100%); box-shadow: 0 4px 10px rgba(232,92,26,.35); }
.fxchip b { font-size: 15px; font-weight: 800; }
.fxchip span { font-size: 11px; font-weight: 600; opacity: .85; }
@media (prefers-reduced-motion: reduce) { .btn.nudge, #bline .r, .btag.in, .fxchip { animation: none; } }
details.more { margin-top: 18px; border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; list-style: none; padding: 11px 0 3px; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: '+'; margin-left: auto; font-size: 18px; line-height: 1; font-weight: 400; color: var(--charcoal); }
details.more[open] summary::after { content: '\2212'; }
details.more summary:hover .lbl { color: var(--orange); }
.morein { padding-top: 4px; }
.morein > .body:first-child { margin-top: 6px; }
ol.toclist { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
ol.toclist button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 0; font-size: 13px; color: var(--charcoal); display: flex; gap: 10px; }
ol.toclist button span { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; width: 20px; }
ol.toclist button.on { color: var(--carbon); font-weight: 700; }
ol.toclist button.on span { color: var(--orange); }
ol.toclist button:hover { color: var(--carbon); }

/* viewport */
main.view { grid-area: view; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--stage); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.tb { position: absolute; top: 12px; display: flex; gap: 8px; align-items: center; z-index: 4; flex-wrap: wrap; }
.tb.tl { left: 12px; }
.tb.tr { right: 12px; }
.tog { border: 1px solid var(--line2); background: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--charcoal); }
.tog:hover:not([disabled]) { border-color: var(--carbon); }
.tog.on { background: var(--carbon); color: #fff; border-color: var(--carbon); }
.tog[disabled] { opacity: .45; cursor: default; }
.tog.on[disabled] { background: #fff; color: var(--charcoal); border-color: var(--line2); }
.tip { position: absolute; pointer-events: none; background: var(--carbon); color: #fff; font-size: 12.5px; padding: 5px 9px; border-radius: 4px; z-index: 6; white-space: nowrap; transform: translate(14px, 14px); }
.tip span { opacity: .7; margin-left: 4px; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
#labels .lab { position: absolute; pointer-events: auto; background: #fff; border: 1px solid var(--line2); border-radius: 3px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--carbon); white-space: nowrap; transform: translateY(-50%); line-height: 1.5; }
#labels .lab.l { transform: translate(-100%, -50%); }
#labels .lab:hover { border-color: var(--carbon); }
#labels .lab.on { border-color: var(--orange); color: var(--orange); }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.titleblock { position: absolute; right: 12px; bottom: 12px; background: #fff; border: 1.5px solid var(--carbon); font-size: 11px; z-index: 4; min-width: 268px; color: var(--carbon); }

.titleblock .grow { flex: 1; }
.hint2 { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); z-index: 4; background: rgba(242,242,241,.9); padding: 4px 8px; border-radius: 4px; }
.toast { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: var(--carbon); color: #fff; padding: 9px 14px; border-radius: 6px; font-size: 13px; z-index: 7; max-width: min(560px, 86%); }

.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; z-index: 1; }

/* ── operate mode: wide panel, builder hidden ── */
#app.op { grid-template-columns: 0 minmax(0, 1fr) 680px; }

.opalert { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; background: #fff; font-size: 13.5px; line-height: 1.42; min-height: 80px; }

.opalert.hint .oa-k { color: var(--orange); width: 72px; }
.oa-ico { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 13px; font-weight: 800; margin-top: 1px; }
.oa-ico.ok { background: var(--carbon); }

.opalert.blocked { border: 2px solid var(--orange); background: #FFF6F1; padding: 9px 12px 10px; animation: alertIn .5s ease-out, alertGlow 1.1s ease-in-out 3; }
.oa-main { flex: 1; min-width: 0; }
.oa-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.oa-head b { font-size: 15.5px; font-weight: 800; color: var(--carbon); letter-spacing: -0.01em; }
.oa-tag { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #fff; background: var(--orange); border-radius: 3px; padding: 2px 7px; }
.oa-x { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--charcoal); padding: 0 2px; }
.oa-why { display: none; margin: 3px 0 0 !important; font-size: 14px; font-weight: 600; color: var(--carbon); }
.oa-short { font-size: 13.5px; font-weight: 700; color: var(--orange); }
.oa-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 5px; margin-top: 6px; counter-reset: st; }
.oa-steps .oa-k { color: var(--orange); }
.oa-steps ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
.oa-steps .oa-k { letter-spacing: .12em; }
.oa-steps .btn.sm { padding: 4px 10px; font-size: 12px; }
.oa-steps li { counter-increment: st; background: #fff; border: 1px solid var(--line2); border-radius: 999px; padding: 1px 7px 1px 3px; font-size: 12px; font-weight: 600; color: var(--carbon); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.oa-steps li::before { content: counter(st); display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--carbon); color: #fff; font-size: 10.5px; font-weight: 700; }
.oa-steps li.target { border-color: var(--orange); }
.oa-steps li.target::before { background: var(--orange); }
.oa-steps .btn { margin-left: auto; }
@keyframes alertIn { 0% { transform: translateY(-5px); background: #FFD3BC; } 100% { transform: none; background: #FFF6F1; } }
@keyframes alertGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,92,26,0); } 50% { box-shadow: 0 0 0 6px rgba(232,92,26,.2); } }
.opgrid3 { display: grid; grid-template-columns: 128px minmax(0, 1fr) 188px; gap: 14px; align-items: start; }
.opgrid3.nomimic { grid-template-columns: minmax(0, 1fr) 220px; }
table.state td { padding: 4px 0; }

.mimic .mt.trip { fill: var(--orange); font-weight: 800; letter-spacing: .08em; }

.need { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--orange); white-space: nowrap; vertical-align: middle; }
.need svg { width: 11px; height: 11px; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: .15; } 100% { opacity: 1; } }
@keyframes blinkOp { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes rowFlash { 0%, 100% { background: #FFF1E9; } 50% { background: #FFD3BC; } }
.actcol { display: flex; flex-direction: column; gap: 5px; }
.actcol .lbl { margin-bottom: 1px; }
.btn.act { text-align: left; display: flex; align-items: center; gap: 7px; padding: 6px 10px; }
.btn.locked { background: #fff; color: var(--charcoal); border-color: var(--line2); border-style: dashed; }
.btn.locked:hover:not([disabled]) { background: #FFF6F1; border-color: var(--orange); color: var(--carbon); }

.body.small, .hint.small { font-size: 12.5px; color: var(--muted); }
.doorsec { margin-top: 12px; }
.doorsec .hint.small { margin-top: 6px; }
.doorhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.doorhead .live { color: var(--orange); }
.lrtag { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--carbon); }
.lrtag.rem { border-color: var(--orange); color: #fff; background: var(--orange); }
.lrtag.flash { box-shadow: 0 0 0 2px var(--orange); }
.fresh .lrtag.flash { animation: blink .55s steps(2, jump-none) 5; }
.doorwrap { background: #F3F3F2; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
svg.door { width: 100%; height: auto; display: block; }
#app.op svg.door { max-height: max(250px, calc(100vh - 584px)); }
svg.door .d-frame { fill: #B9BEC1; }
svg.door .d-face { fill: #DADDDB; stroke: #8E9499; stroke-width: 1.5; }
svg.door .d-hinge, svg.door .d-handle { fill: #2B2D2F; }

svg.door .dl { fill: #1d1d1d; font-weight: 700; }

svg.door .pm-cap { fill: #CFD8D2; font-weight: 600; }

svg.door .pr-body { fill: #2C2F32; }
svg.door .pr-lcd { fill: #C9DCCF; }
svg.door .relay.tripped .pr-lcd { fill: #F6C9B4; }
svg.door .pr-title { fill: #1C2A22; font-weight: 800; }
svg.door .pr-status { fill: #1C2A22; font-weight: 700; }
svg.door .pr-cap { fill: #CFD2D4; font-weight: 600; }
svg.door .pr-screw { fill: #9AA0A4; }
svg.door .led-lit { filter: drop-shadow(0 0 4px currentColor); }
svg.door .ann-box { fill: #F2F2EE; stroke: #7D8388; stroke-width: 1.5; }
svg.door .ann-txt { fill: #222; font-weight: 700; }

svg.door .bezel { fill: #C9CCCE; stroke: #6E7479; stroke-width: 1.5; }
svg.door .x { stroke: rgba(255,255,255,.28); stroke-width: 1.6; }
svg.door .halo { opacity: .28; }
svg.door .lamp.lit circle[r="11"] { filter: drop-shadow(0 0 5px rgba(255,255,255,.4)); }
svg.door .shine { fill: rgba(255,255,255,.75); }
svg.door .shine2 { fill: rgba(255,255,255,.35); }
svg.door .blank { fill: #E3E5E4; stroke: #8A9095; stroke-width: 1.5; }
svg.door .sel-body, svg.door .vs-body { fill: #D4D7D9; stroke: #4D5155; stroke-width: 1.5; }
svg.door .sel-bar { fill: #2A2A2A; transition: transform .25s ease; }
svg.door .pos { fill: #777; font-weight: 700; }
svg.door .pos.on { fill: var(--orange); }
svg.door .hot { cursor: pointer; }
svg.door .hot:hover .bezel, svg.door .hot:hover .sel-body { stroke: var(--orange); stroke-width: 3; }
svg.door .hot:focus { outline: none; }
svg.door .hot:focus-visible .bezel, svg.door .hot:focus-visible .sel-body { stroke: var(--orange); stroke-width: 4; }
svg.door .pb.pressed { animation: press .25s ease-out; transform-box: fill-box; }
@keyframes press { 50% { opacity: .55; } }
svg.door .flash-ring { fill: none; stroke: var(--orange); stroke-width: 4; }
.fresh svg.door .flash-ring { animation: blink .55s steps(2, jump-none) 5; }
.fresh svg.door .flash { animation: blinkOp .55s ease-in-out 5; }
svg.door .callout { pointer-events: none; }

/* PSEC operating panel (live, Operate tab) */
svg.pz-panel .pz-cover { fill: rgba(255,255,255,.26); stroke: rgba(255,255,255,.9); stroke-width: 2; }
svg.pz-panel .pz-hole { fill: #2a2a2a; }

svg.pz-panel .pz-shut { fill: #1c1c1c; opacity: .82; pointer-events: none; }
svg.pz-panel .pz-t { font-size: 9.5px; font-weight: 600; fill: #1d1d1d; }
svg.pz-panel .pz-b { font-size: 10px; font-weight: 700; fill: #1d1d1d; }
svg.pz-panel .pz-pos { font-size: 13px; font-weight: 800; fill: #fff; letter-spacing: .06em; }

.optools { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 12px; }

/* viewport banner for blocked operations */
.bbanner[hidden] { display: none; }
.bbanner { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 8; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--orange); border-radius: 10px; padding: 12px 12px 12px 14px; width: min(600px, calc(100% - 24px)); box-shadow: 0 10px 28px rgba(17,17,17,.14); }
.bbanner.in { animation: bannerIn .4s cubic-bezier(.2,.8,.2,1); }

.bb-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }

.bb-where { font-size: 12.5px; color: var(--orange); font-weight: 700; line-height: 1.4; }

@media (prefers-reduced-motion: reduce) {
  .opalert.blocked, .fresh .mimic .m-flash, .fresh .mimic .mg.flash, .fresh table.state tr.blk td, .fresh svg.door .flash-ring, .fresh svg.door .flash, .fresh svg.door .callout, .fresh .lrtag.flash, .bbanner.in, .btn.act.shake { animation: none !important; }
}

}

  .oa-why { display: block; }
  .bbanner { top: 12px; }

}

ign, screw locks and emergency unlock; the rear-door interlock instruction plate sits on the frame strip above it. At the rear, two hinged covers; the lower one is the cable door, interlocked with the earthing switch.',specs:[["Door zones incl. frame strips, top \u2192 bottom","731 / 770 / 730 mm","613 / 1003 / 750 mm"],["Construction","Pressed steel, flat face, both sides bent back, external hinges","Pressed steel, flat face, both sides bent back, external hinges"],["Breaker door","VCB label plate \xB7 window \xB7 ES port \xB7 lever handle","VCB label plate \xB7 window \xB7 ES port \xB7 lever handle"],["Breaker door interlock","Close + lock","Close + lock"],["Earthing switch operation","Manual, door closed, padlockable port","Manual, door closed, padlockable port"],["Cable-compartment door","Window \xB7 danger sign \xB7 emergency unlock","Window \xB7 danger sign \xB7 emergency unlock"],["Rear covers","2, hinged; lower interlocked with the ES","2, hinged; lower interlocked with the ES"],["Top hood","On the frame top, above the LV door \xB7 PLGEAR12 + logo","On the frame top, above the LV door \xB7 PLGEAR24 + logo"]],source:"Front views, GA drawings \xB7 PL-MVSG-CB-SPEC Rev. 4 \xA73, \xA76 \xB7 factory photos of a PLGEAR12 cell (LV door to the frame top, hood above it)"},roof:{name:"Roof plates",area:"Roof",label:"Roof plates",ask:"Where does the pressure go if an internal arc happens?",answer:"Up, through the removable internal-arc plates in the roof, away from the operator at the front.",body:"Each cell\u2019s roof carries removable internal-arc plates and perforated ventilation plates over the compartments (see the top views on the GA drawings).",specs:[["Main plate width","640 mm","860 mm"],["Height above frame","79.5 mm","80 mm"],["Plate types","Internal-arc removable + ventilation","Internal-arc removable + ventilation"]],source:"Top views, GA drawings PLGEAR12901 / PLGEAR24901"},busbar:{name:"Main busbar",area:"Busbar compartment",label:"Main busbar",ask:"How does power travel along the line-up?",answer:"On copper main busbars that run through every cell.",body:"Three phases run the full length of the line-up at the rear of the busbar compartment and pass from cell to cell through side-wall bushings. At 12 kV the phases are stacked vertically; at 24 kV they sit in a triangle.",specs:[["Bar section","Cu 80 \xD7 10 mm","Cu 120 \xD7 10 mm"],["Bars per cell","6 (2 per phase)","3 (1 per phase)"],["Bar length per cell","800 mm (holes at 761 mm)","1140 mm"],["Phase arrangement","Vertical stack","Triangle, 2 top + 1 below"]],source:"Busbar sheet: PLGEAR12901 p.4 (part 1) / PLGEAR24901 p.3 (part 1)"},bushing:{name:"Side-wall bushing",area:"Busbar compartment",label:"Side-wall bushing",ask:"How does the busbar get through the side walls?",answer:"Through cast-epoxy side-wall bushings, one per phase in every wall.",body:"The bushing insulates the busbar from the earthed side wall, so each cell\u2019s busbar compartment stays closed off from its neighbour.",specs:[["Rated / highest voltage Um","12 kV","24 kV"],["Power-frequency withstand Ud (1 min, dry)","28 kV rms","50 kV rms"],["Lightning impulse BIL (1.2/50 \xB5s)","75 kV peak","125 kV peak"],["Rated frequency","50 Hz","50 Hz"],["Rated normal current","630 / 1250 / 1600 / 2000 / 2500 / 3150 A (per design)","Feeder 630\u20132000 A \xB7 busbar up to 4000 A"],["Short-time withstand Ik","25 or 31.5 kA / 3 s","31.5 kA / 4 s"],["Peak withstand Ip","63 / 80 kA peak","80 kA peak"],["Body","Oval, 190 \xD7 190 mm","Round, \xD8200 \xD7 280 mm, bore \xD8135"],["Flange","210 \xD7 140 mm, 4 \xD7 \xD810 at 180 \xD7 110","210 \xD7 210 mm, holes at 180 \xD7 180"],["Insulating material","Cast cycloaliphatic epoxy resin, indoor","Cast cycloaliphatic epoxy resin, indoor"]],source:"Switch Gear 12 KV / 24 KV \u2014 part 1, Passing Bushing"},insulator:{name:"Support insulator",area:"Busbar compartment",label:"Insulator",ask:"What holds the busbar in place inside the compartment?",answer:"Epoxy support insulators fixed to the earthed steel.",body:"They keep the copper at a fixed distance from earthed metal, so the bars stay put under short-circuit forces.",specs:[["Size","\xD885 \xD7 145 mm","\xD870 \xD7 210 mm"]],source:"Busbar sheet, part 9: PLGEAR12901 p.4 / PLGEAR24901 p.3"},dropper:{name:"Busbar connections",area:"Busbar & cable compartments",label:"Connections",ask:"How does the main busbar reach the breaker?",answer:"Through formed copper connection bars bolted to the spouts.",body:"Formed bars (parts 2\u20138 on the busbar sheet) link the main busbar to the spouts and carry the cable-side circuit to the CTs and terminations.",specs:[["Section, parts 2\u20138","Cu 80 \xD7 10 mm","Cu 80 \xD7 10 mm"],["Parts 2, 3, 4","1 of each per cell","1 of each per cell"],["Part 5","3 per cell","3 per cell"],["Parts 6, 7","Qty 3 per cell (per drawing)","3 of each per cell"],["Part 8","3 \u2014 incoming cell only","3 per cell"]],source:"Busbar sheet: PLGEAR12901 p.4 / PLGEAR24901 p.3"},spout:{name:"Spout (contact box)",area:"Partition: breaker \u2194 busbar / cable",label:"Spout",ask:"Where does the breaker plug in?",answer:"Into six epoxy spouts: three on the busbar side, three on the cable side.",body:"Each spout is fixed through the partition and holds a silver-plated fixed contact. When the truck reaches Service, the breaker\u2019s tulip contacts slide over the fixed contacts.",specs:[["Rated / highest voltage Um","12 kV","24 kV"],["Power-frequency withstand Ud (1 min, dry)","28 kV rms","50 kV rms"],["Lightning impulse BIL (1.2/50 \xB5s)","75 kV peak","125 kV peak"],["Rated frequency","50 Hz","50 Hz"],["Rated normal current","630 / 1250 / 1600 / 2000 / 2500 / 3150 A (per design)","Feeder 630\u20132000 A \xB7 busbar up to 4000 A"],["Short-time withstand Ik","25 or 31.5 kA / 3 s","31.5 kA / 4 s"],["Peak withstand Ip","63 / 80 kA peak","80 kA peak"],["Length","252 mm","340 mm"],["Bore / mouth","\xD8126 / \xD8146 mm","\xD8120 / \xD8195 mm"],["Flange","140 \xD7 140 mm","\u2248 205 \xD7 225 mm, 4 \xD7 M10 at 165 \xD7 180"],["Insulating material","Cast cycloaliphatic epoxy resin, indoor","Cast cycloaliphatic epoxy resin, indoor"]],source:"Switch Gear 12 KV / 24 KV \u2014 part 2, Spout (Contact Box)"},contact:{name:"Fixed contact",area:"Inside the spout",label:"Fixed contact",ask:"What carries the current inside the spout?",answer:"A silver-plated 1250 A fixed contact.",body:"Silver plating keeps the contact resistance low and stable. The main-circuit resistance is measured before and after the temperature-rise test and must not rise above 1.2 times the first value.",specs:[["Rated current","1250 A","1250 A"],["Finish","Silver-plated","Silver-plated"],["Main-circuit resistance after temperature rise","\u2264 1.2 \xD7 value before","\u2264 1.2 \xD7 value before"]],source:"Fixed Contact 1250 A photo \xB7 PL-MVSG-CB-SPEC Rev. 4, type test 6"},shutter:{name:"Shutter mechanism",area:"Circuit-breaker compartment",label:"Shutter mechanism",ask:"What covers the live contacts when the breaker is out?",answer:"Metal shutters that close automatically as the truck racks out.",body:"The upper shutter (marked INPUT) covers the busbar-side spouts and the lower one (OUTPUT) covers the cable side. Levers on both sides are driven by the truck, so the shutters only open as the tulip contacts arrive.",specs:[["Assembly W \xD7 H","792 \xD7 775 mm","981 \xD7 998 mm"],["Assembly depth (levers)","268.9 mm","373.6 mm"],["Plates","2 \u2014 busbar side / cable side","2 \u2014 busbar side / cable side"],["Drive","Truck-operated side levers","Truck-operated side levers"]],source:"Switch Gear 12 KV / 24 KV \u2014 part 3, Shutter Mechanism"},vcb:{name:"VD4 vacuum circuit breaker",area:"Circuit-breaker compartment",label:"VD4",ask:"What interrupts the fault current?",answer:"An ABB VD4 vacuum breaker: 31.5 kA at 12 kV, 25 kA at 24 kV.",body:"Three embedded epoxy poles with vacuum interrupters behind a stored-energy spring mechanism. Each pole has an upper and a lower contact arm, and each arm ends in a tulip contact that plugs onto a fixed contact in the spouts. The breaker rides on a withdrawable truck with two pull handles and the racking coupling at its front.",specs:[["Type","VD4 12.12.32 p210","VD4 24.12.25 p275"],["Rated voltage Ur","12 kV","24 kV"],["Power-frequency withstand Ud (1 min)","28 kV","50 kV"],["Lightning impulse Up","75 kV","125 kV"],["Rated frequency","50\u201360 Hz","50\u201360 Hz"],["Rated normal current Ir (40 \xB0C)","1250 A","1250 A"],["Short-circuit breaking current Isc","31.5 kA","25 kA"],["Short-time withstand Ik (3 s)","31.5 kA","25 kA"],["Short-circuit making current Ip","80 kA","63 kA"],["Poles \u2014 interrupting / insulation","3 \u2014 vacuum / epoxy resin","3 \u2014 vacuum / epoxy resin"],["Operating sequence","O\u20130.3s\u2013CO\u201315s\u2013CO","O\u20130.3s\u2013CO\u201315s\u2013CO"],["Opening / closing time","33\u201360 / 60\u201380 ms","33\u201360 / 60\u201380 ms"],["Total break time","43\u201375 ms","43\u201375 ms"],["Pole centre distance P","210 mm","275 mm"],["Breaker H \xD7 D \xD7 W","461 \xD7 424 \xD7 570 mm","631 \xD7 424 \xD7 700 mm"],["Lower \u2194 upper terminal (u/l)","205 mm","310 mm"],["Lower terminal to base (l/g)","217.5 mm","282.5 mm"],["Weight","75 kg","104 kg"],["Reference standard","IEC 62271-100","IEC 62271-100"]],specs3Title:"Withdrawable part (breaker on its truck)",specs3:[["Width \xD7 height","652 \xD7 628 mm","853 \xD7 814 mm"],["Height to the breaker top","482 mm",null],["Front to tulip contacts","640.5 mm",null],["Contact arms","\xD850 mm","In fluted insulating sleeves"],["Tulip contacts","86 mm","166 mm"],["At the front","2 pull handles \xB7 racking coupling","2 pull handles \xB7 racking coupling"],["Drawing","VD4 12kv","1VCD000177"]],specs2Title:"Order configuration",specs2:[["Installation / pole type","Withdrawable / embedded pole","Withdrawable / embedded pole"],["Open / close coils","110 V DC / 110 V AC","110 V DC / 110 V AC"],["Charging motor","110 V DC / 110 V AC","110 V DC / 110 V AC"],["Anti-pumping relay","Required","Required"],["Closing interlock Y1 / position interlock Y2","110 V DC / 110 V AC","110 V DC / 110 V AC"],["Second opening release","110 V DC / 110 V AC","110 V DC / 110 V AC"],["Auxiliary contacts","min. 4 NO + 4 NC","min. 4 NO + 4 NC"],["Secondary connection","58-pin aviation plug","58-pin aviation plug"],["Mechanical endurance","M2 \u2014 10 000 operations","M2 \u2014 10 000 operations"],["Trip-free","Mechanical & electrical","Mechanical & electrical"],["Operation counter","Front-mounted","Front-mounted"]],source:"Rated data: PL-DS-CB-012 / PL-DS-CB-024 Rev. 0 \xB7 Order configuration: PL-MVSG-CB-SPEC Rev. 4 \xB7 Withdrawable part: Powerline drawings VD4 12kv / 1VCD000177"},vcbPL:{name:"Powerline vacuum circuit breaker",area:"Circuit-breaker compartment",label:"Powerline VCB",ask:"What interrupts the fault current?",answer:"Powerline\u2019s withdrawable vacuum breaker: 1250 A, 31.5 kA at 12 kV, 25 kA at 24 kV.",body:"Chosen with PL in the 3rd segment of the code. It rides on the withdrawable truck with the same interlocks and the ratings on the offer. The 3D breaker is drawn to the current frame size until the Powerline VCB drawing is added. The Powerline VCB (PL) is coming soon in this explorer.",specs:[["Code letters","PL","PL"],["Rated voltage Ur","12 kV","24 kV"],["Rated normal current Ir","1250 A","1250 A"],["Short-circuit breaking current Isc","31.5 kA","25 kA"],["Short-time withstand Ik","31.5 kA / 3 s","25 kA / 3 s"],["Interrupting medium","Vacuum (no SF6)","Vacuum (no SF6)"],["Installation","Withdrawable truck","Withdrawable truck"],["Offer text","Powerline withdrawable vacuum circuit breaker","Powerline withdrawable vacuum circuit breaker"]],source:"PLGEAR coding reference \xA71, \xA76"},truck:{name:"Truck, guide rails & interlock",area:"Circuit-breaker compartment",label:"Truck & guide rails",ask:"How far does the breaker travel between Test and Service?",answer:"200 mm at 12 kV, 300 mm at 24 kV.",body:"The breaker rides on a truck along two guide rails. The racking drive moves it between Test (primary isolated, secondary still plugged in) and Service (plugged into the spouts). The same assembly carries the long shaft that interlocks the earthing switch with the truck position.",specs:[["Racking stroke, Test \u2194 Service","200 mm","300 mm"],["Guide rail length","679 mm","837 mm"],["Assembly length (rail + ES interlock shaft)","1413.5 mm","1775 mm"],["Truck earthing","Bottom friction earthing","Bottom friction earthing"],["Door interlock","Close + lock","Close + lock"],["Truck width","652 mm","853 mm"],["At the front","2 pull handles \xB7 racking coupling","2 pull handles \xB7 racking coupling"]],source:"Switch Gear 12 KV / 24 KV \u2014 part 4 \xB7 PL-MVSG-CB-SPEC Rev. 4 \xA73 \xB7 Powerline drawings VD4 12kv / 1VCD000177"},es:{name:"Earthing switch",area:"Cable compartment",label:"Earthing switch",ask:"How is the cable made safe to touch?",answer:"Close the earthing switch. It only closes with the truck in Test.",body:"A 3-pole earthing switch on the cable side of the CTs. Making class E2 means it is tested to close onto a short circuit five times.",specs:[["Type","3-pole earthing switch","3-pole earthing switch"],["Location","Cable side of the CT (not the busbar side)","Cable side of the CT (not the busbar side)"],["Short-time withstand","25 / 31.5 kA, 1 s","25 kA, 1 s"],["Making capacity (peak)","80 kA \u2014 class E2","62.5 kA \u2014 class E2"],["Mechanical endurance","2000 operations \u2014 class M1","2000 operations \u2014 class M1"],["Phase pitch","210 mm","275 mm"],["Overall width","544 mm","670 mm"],["Fitted on","Every incoming & outgoing feeder","Every incoming & outgoing feeder"],["Operation","Manual, door closed","Manual, door closed"],["Standards","IEC 62271-102 / -200","IEC 62271-102 / -200"]],source:"PL-MVSG-CB-SPEC Rev. 4 \xA76\u20137 \xB7 Switch Gear 12 KV / 24 KV \u2014 part 5"},ct:{name:"Current transformers",area:"Cable compartment",label:"Current transformer",ask:"Where is the current measured?",answer:"On the cable side of the breaker, by one cast-resin CT per phase.",body:"Block-type cast-resin CTs, one per phase, with their base plates on the rear of the cable compartment. Both primary terminals, P1 and P2, sit between two fins on the face towards the breaker, so the primary current passes through the CT between them. The secondaries feed the protection relay and the meters. Ratio, accuracy class and burden come from the project\u2019s protection study, not from the cell design.",specs:[["Quantity","3 per feeder","3 per feeder"],["Type","Block type, cast resin","Block type, cast resin, ribbed with sheds"],["Body L \xD7 W \xD7 H","275 \xD7 150 \xD7 270 mm","320 \xD7 178 \xD7 340 mm"],["Primary terminals","P1 / P2, 130 mm apart","P1 / P2 (K / L), 152 mm apart"],["Bolt holes per terminal","2, 32 mm apart","2, 32 mm apart"],["Terminal fins","100 mm apart","105 mm apart"],["Shed pitch",null,"25 mm"],["Base plate","335 mm long, holes 275 \xD7 126 mm","369 mm long, with the secondary terminal box"],["Position","Cable side, between the lower spout and the cable","Cable side, between the lower spout and the cable"],["Ratings","Per project","Per project"],["Drawing","CT 12 KV (RMUP016.0)","CT 24"]],source:"Powerline drawings CT 12 KV (RMUP016.0) / CT 24 \xB7 position: side-section views, GA drawings"},vt:{name:"Voltage transformers",area:"Lower front compartment",label:"Voltage transformer",ask:"Where does the relay get its voltage signal?",answer:"From the VTs in the incoming cell\u2019s lower front compartment.",body:"Three single-pole cast-resin VTs stand at the front of the incoming cell\u2019s lower compartment. Each has a horizontal \xD880 mm HV arm that points back towards the cable side, with the HV terminal at its end. They step the medium voltage down for protection and metering.",specs:[["Quantity","3 (incoming cell)","3 (incoming cell)"],["Type","Single pole, cast resin","Single pole, cast resin"],["Overall length","502 mm","609 mm with the secondary box (485 mm without)"],["Height","305 mm (body 220 mm)","341 mm"],["Width","150 mm","178 mm"],["HV arm","\xD880 mm, 245 mm beyond the body","\xD880 mm"],["HV terminal","\xD835 / \xD825 mm","\xD835 / \xD825 mm"],["Base","335 mm plate, holes 275 \xD7 126 mm","Two feet, 164 mm across, holes 280 \xD7 130 mm"],["Position","Lower front compartment","Lower front compartment"],["Ratings","Per project","Per project"],["Drawing","VT12KV","VT 24"]],source:"Powerline drawings VT12KV / VT 24 \xB7 position: side-section views, GA drawings"},sa:{name:"Surge arresters",area:"Cable compartment",label:"Surge arrester",ask:"What protects the cable from overvoltage?",answer:"Surge arresters, one per phase, at the cable end.",body:"They clamp switching and lightning surges before they reach the cable insulation.",specs:[["Quantity","3 per feeder","3 per feeder"],["Position","Cable compartment floor, rear","Cable compartment floor, rear"],["Rating","Per project","Per project"]],source:"Side-section views, GA drawings (no arrester datasheet in this pack)"},cable:{name:"Cable terminations",area:"Cable compartment",label:"Cable termination",ask:"Where do the power cables come in?",answer:"From below, into the rear cable compartment.",body:"Each phase lands on the cable connection bar with a bolted lug. Access is through the hinged rear cable door, which only opens with the earthing switch closed (instruction plate on the panel; emergency unlock aside).",specs:[["Entry","Bottom","Bottom"],["As modelled","1 single-core cable per phase","1 single-core cable per phase"],["Size / termination type","Per project","Per project"]],source:"Side-section views, GA drawings"},lv:{name:"LV compartment",area:"LV compartment",label:"LV compartment",ask:"Where do protection and control live?",answer:"In the LV compartment, segregated from every MV part.",body:"Protection relay, meters, alarm windows, position lamps and push buttons on the door; MCBs and terminals inside. The breaker\u2019s secondary circuits plug in through a 58-pin aviation plug; its coils and charging motor run at 110 V DC / AC.",specs:[["Location","Front, top","Front, top"],["LV door height","731 mm (to the frame top)","613 mm (to the frame top)"],["Door layout drawing","960 \xD7 610 mm (scaled to this door)","960 \xD7 610 mm"],["Feeder door instruments","PR relay \xB7 3 \xD7 A \xB7 alarms: DC loss, any MCB trip, PR trip","PR relay \xB7 3 \xD7 A \xB7 alarms: DC loss, any MCB trip, PR trip"],["Incomer adds","PM \xB7 V with selector \xB7 AC loss alarm","PM \xB7 V with selector \xB7 AC loss alarm"],["Position lamps","ON \xB7 OFF \xB7 Trip \xB7 ES OFF / ON \xB7 CB Operation / Test","ON \xB7 OFF \xB7 Trip \xB7 ES OFF / ON \xB7 CB Operation / Test"],["Door controls","ON / OFF push buttons \xB7 Reset \xB7 L/R selector","ON / OFF push buttons \xB7 Reset \xB7 L/R selector"],["Breaker secondary plug","58-pin aviation plug","58-pin aviation plug"],["Coil / motor supply","110 V DC / 110 V AC","110 V DC / 110 V AC"],["Auxiliary contacts","min. 4 NO + 4 NC","min. 4 NO + 4 NC"]],source:"GA drawings \xB7 LV door layouts (Incoming, Outgoing, Coupler, Riser) \xB7 PL-MVSG-CB-SPEC Rev. 4 \xA71\u20132"},crossbus:{name:"Cross-bus",area:"Cable compartment",label:"Cross-bus",generic:!0,ask:"How does the coupler reach the second busbar section?",answer:"Through a cross-bus that runs low across to the riser cell.",body:"The coupler breaker\u2019s cable side is not a cable at all: copper bars carry it sideways into the riser, which lifts it back up to busbar section B.",specs:[["Status","Indicative \u2014 drawing not supplied","Indicative \u2014 drawing not supplied"]],source:"Indicative arrangement for teaching; replace with the coupler / riser drawing"},riser:{name:"Riser links",area:"Busbar & cable compartments",label:"Riser links",generic:!0,ask:"Why does a coupler need a riser?",answer:"The busbar is split between them. The riser lifts the cross-bus up to section B.",body:"Fixed copper links with no switching device. Coupler and riser come as a pair: C1 in the code.",specs:[["Status","Indicative \u2014 drawing not supplied","Indicative \u2014 drawing not supplied"]],source:"Indicative arrangement for teaching; replace with the riser drawing"},blank:{name:"Blank front cover",area:"Circuit-breaker compartment",label:"Blank cover",generic:!0,ask:"Why is the riser\u2019s breaker compartment empty?",answer:"A riser has no switching device, so a fixed cover closes the opening.",body:"Shown for completeness. The real riser may differ; replace with the riser drawing when available.",specs:[["Status","Indicative \u2014 drawing not supplied","Indicative \u2014 drawing not supplied"]],source:"Indicative arrangement for teaching"},lbs:{name:"Load-break switch",area:"Cable compartment",label:"Load-break switch",generic:!0,ask:"What switches a service cell?",answer:"A load-break switch in place of a circuit breaker.",body:"A load-break switch makes and breaks load current; the fuses below it clear faults. Shown as an indicative arrangement until the service-cell drawing is added.",specs:[["Code","S in the 7th position = service panel","S in the 7th position = service panel"],["Status","Indicative \u2014 drawing not supplied","Indicative \u2014 drawing not supplied"]],source:"PLGEAR coding reference \xB7 indicative arrangement for teaching"},fuse:{name:"HV fuses",area:"Cable compartment",label:"Fuses",generic:!0,ask:"What clears a fault in a service cell?",answer:"HV fuses below the load-break switch, one per phase.",body:"Fuse rating is set by the service transformer or load. Shown as an indicative arrangement.",specs:[["Status","Indicative \u2014 drawing not supplied","Indicative \u2014 drawing not supplied"]],source:"Indicative arrangement for teaching"},lbsmech:{name:"LBS operating mechanism",area:"Circuit-breaker compartment",label:"LBS mechanism",generic:!0,ask:"Where is the load-break switch operated from?",answer:"From the ft"),mV("Padlocks","Up to 3, shackle \xD8 6 mm max."),mV("Motor operation (option -MAD)","24 \u2013 220 V, < 5 s"),mV("Auxiliary contacts","4 line + 4 earth")],source:"ABB GSec catalogue 1VCP000470, Description and Accessories"},panel:{name:"Operating panel",area:"Front, middle",label:"Operating panel",ask:"What is on the orange panel?",answer:"The mimic diagram, the position indicator and the two operating holes.",body:"Each panel shows the feeder\u2019s single line with the live position indicator, the SF6 gas gauge, the earthing-switch and the load-break-switch operating holes under clear covers, the padlock slide plate between them and the voltage-indicator sockets. The transformer feeder adds OPEN / CLOSE push buttons, a key lock and the spring Charged / Discharged indicator. The operating procedure is printed on the panel.",specs:[mV("Height","446 mm"),mV("Operating holes","Earthing switch \xB7 load-break switch (clear covers)"),mV("Slide plate","Uncovers one hole at a time, padlockable"),mV("Indicators","Position \xB7 SF6 gas gauge \xB7 VPIS"),mV("Transformer feeder adds","OPEN / CLOSE buttons \xB7 key lock \xB7 spring indicator")],source:"Factory photos of the PSEC front panels"},vpis:{name:"Voltage indicators (VPIS)",area:"Operating panel",label:"VPIS",ask:"How do you see that the cable is live?",answer:"On the three voltage-indicator sockets: lit means live.",body:"The capacitive dividers are built into the GSec bottom insulators, so no extra post insulators are needed. The sockets also allow a phase-concordance check.",specs:[mV("Standard","IEC 61958"),mV("Dividers","Built into the GSec bottom insulators"),mV("Sockets","3 per feeder")],source:"ABB GSec catalogue 1VCP000470, Accessories (VPIS)"},fuse:{name:"HV fuses",area:"Cable compartment",label:"Fuses",ask:"What protects the transformer?",answer:"Three HV fuses. A blown fuse trips the GSec open.",body:"One fuse per phase, low in the cable compartment, leaning in the front plane: the white holder head up on the left, the flange down on the right on its bracket. An insulated lead feeds each one from the GSec/T2F fuse-holder head. The fuse striker drives the tripping system, so the switch opens on all three phases when one fuse blows. Replace the fuse with the switch earthed and the door open.",specs:[mV("Quantity","3, one per phase"),mV("Position","Cable compartment, \u2248 220\u2013530 mm above the floor"),mV("Mounting","Inclined \u2248 32\xB0 from vertical, flange on a floor bracket"),mV("Feed","Insulated lead from the GSec/T2F fuse-holder head"),mV("Blown fuse","Trips the switch open \xB7 indicator + signal contact"),mV("Type / rating","CEF, per transformer (IEC 60282-1, DIN 43625)")],source:"GA drawing PSEC99001, sheets 2\u20133 (front and back views) \xB7 ABB GSec catalogue 1VCP000470, GSec/T2F and fuse selection"},ct:{name:"Current transformers",area:"Measuring cell",label:"Current transformer",ask:"Where is the current measured?",answer:"In the measuring cell: the busbar drops onto P1 of one CT per phase and leaves from P2.",body:"The same block-type cast-resin CT as in PLGEAR, mounted on its side: base plate on the left support, primary terminals facing right with P1 above P2, its width across the depth. The accuracy class follows the provider.",specs:[mV("Quantity","3, one per phase, 230 mm apart"),["Type","Block type, cast resin","Block type, cast resin, with sheds"],["Body L \xD7 W \xD7 H","275 \xD7 150 \xD7 270 mm","320 \xD7 178 \xD7 340 mm"],mV("Position","Centre \u2248 970 mm high, terminals 340 mm from the left"),mV("Class, EEHC / KAHRABA","0.5S / 0.2"),mV("Ratio","Per project"),["Drawing","CT 12 KV (RMUP016.0)","CT 24"]],source:"Powerline drawings CT 12 KV / CT 24 \xB7 position: GA drawing PSEC99001, sheets 2\u20133 \xB7 class: PSEC coding system \xA74"},vt:{name:"Voltage transformers",area:"Measuring cell",label:"Voltage transformer",ask:"Where does the meter get its voltage?",answer:"From three VTs at the bottom right of the measuring cell.",body:" -core cable per phase"),mV("Size / termination","Per project")],source:"ABB GSec catalogue 1VCP000470 (cable connections in the bottom insulators) \xB7 GA drawing PSEC99001"},earth:{name:"Earthing bar",area:"Cable compartment floor",label:"Earthing bar",ask:"How is the line-up earthed?",answer:"By one copper earthing bar along the front of the floor.",body:"The bar runs through every cubicle, bolted to an earthing bracket in each one. Braids connect the doors and the cable screens to it.",specs:[mV("Earthing bar","Cu 25 \xD7 5 mm, 2690 mm (3+1+M)"),mV("Brackets","120 \xD7 120 \xD7 10 mm angle")],source:"GA drawing PSEC99001, sheet 3, items 4 and 5"},insulator:{name:"Support insulators",area:"Measuring cell",label:"Insulator",ask:"What holds the bar coming back from the CT?",answer:"A cast-resin support insulator per phase, on the right-hand post.",body:"It holds item 2 at a fixed distance from earthed metal, at about 1190 mm.",specs:[mV("Material","Cast epoxy resin"),mV("Position","Right-hand post, \u2248 1190 mm high")],source:'GA drawing PSEC99001, sheet 2 ("Insulator")'},lv:{name:"LV box",area:"Front, top",label:"LV box",ask:"Where are the auxiliary circuits?",answer:"In the LV box at the top front of each switch cubicle.",body:"Behind the door: a DIN rail with MCBs and terminals, and the wiring of the GSec auxiliary contacts and motor. The measuring cell carries its meters on its upper door: three ammeters, the voltmeter and the energy meter, in one row.",specs:[mV("Door","490 \xD7 255 mm, quarter-turn lock"),mV("Inside","DIN rail \xB7 MCBs \xB7 terminals"),mV("Measuring cell","Meter door: 3 ammeters, voltmeter, energy meter")],source:"GA drawing PSEC99001, sheet 1 \xB7 factory photos of the LV boxes"}},ox=["busbar","gsec","mech","panel","fuse","ct","vt","mbar","cable","insulator","lv","roof","earth"],gE={lv:q=>[[[8,q.W-8],[q.doors.box[0]+4,q.H-6],[6,q.boxD]]],mech:q=>[[[8,q.W-8],[q.doors.panel[0]+4,q.doors.box[0]-4],[6,q.mech.d[1]]]],bus:q=>[[[8,q.W-8],[q.plate
