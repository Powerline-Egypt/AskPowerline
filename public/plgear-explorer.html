:root {
  --orange: #E85C1A; --carbon: #111111; --charcoal: #3A3A3A; --grey: #CCCCCC;
  --bg: #F4F4F4; --card: #FFFFFF; --stage: #F2F2F1;
  --line: rgba(17,17,17,.10); --line2: rgba(17,17,17,.20); --muted: rgba(58,58,58,.74); --soft: #F6F6F5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--charcoal); font-family: Archivo, Arial, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .22em; color: var(--charcoal); line-height: 1.4; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-weight: 700; }
.mut { color: var(--muted); font-weight: 400; }
.mt { margin-top: 18px; }

#app { display: grid; height: 100vh; grid-template-columns: 292px minmax(0, 1fr) 384px; grid-template-rows: 64px minmax(0, 1fr); grid-template-areas: "head head head" "left view right"; }

/* header */
header.top { grid-area: head; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
.brand { padding: 17px 18px 17px 0; border-right: 1px solid var(--line); flex: none; }
.brand img { height: 30px; width: auto; display: block; }
.ttl { min-width: 0; }
.ttl h1 { margin: 2px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: var(--carbon); line-height: 1.1; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: #fff; border: 1px solid var(--line2); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 13px; color: var(--charcoal); white-space: nowrap; }
.seg button:hover { background: var(--soft); }
.seg button.on { background: var(--carbon); color: #fff; }
.seg.sm button { padding: 5px 11px; font-size: 12.5px; }
.plg { position: relative; display: flex; align-items: center; gap: 12px; }
.code { border: 1px solid var(--line2); background: #fff; padding: 5px 12px; border-radius: 6px; font-weight: 800; font-size: 18px; letter-spacing: .04em; color: var(--carbon); font-variant-numeric: tabular-nums; display: inline-flex; gap: 0; }
.code:hover { border-color: var(--carbon); }
.code .cs.kv, .code .cs.n { color: var(--orange); }
.code .cs.cb { color: var(--charcoal); }
.code .cs.l { color: var(--muted); }
.code .cs + .cs { margin-left: 3px; }
.code .cs.l + .cs.l { margin-left: 1px; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 360px; background: #fff; border: 1px solid var(--line2); border-radius: 8px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(17,17,17,.12); z-index: 30; }
.pop .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 16px; color: var(--carbon); }
.pop .iname { margin-top: 10px; }

/* side panels */
aside { background: #fff; min-height: 0; }
aside.left { grid-area: left; border-right: 1px solid var(--line); overflow: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
aside.right { grid-area: right; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.hint b { color: var(--carbon); }
.stepnum { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: 0; line-height: 1; }
.stephead { display: flex; gap: 10px; align-items: flex-start; }
.stephead b { display: block; font-size: 15.5px; font-weight: 700; color: var(--carbon); letter-spacing: -0.01em; line-height: 1.25; }
.stephead small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 2px; }
/* builder */
.builder { display: flex; flex-direction: column; margin-top: -6px; }
.brow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.opencode { border-top: 1px solid var(--line); padding-top: 14px; }
.opencode .hint .link { font-size: 12px; }
.brow .bl { display: flex; flex-direction: column; min-width: 0; font-weight: 600; font-size: 13.5px; color: var(--carbon); line-height: 1.25; }
.brow .bl small { font-weight: 400; font-size: 11.5px; color: var(--muted); }
.stp { display: inline-flex; align-items: stretch; flex: none; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: #fff; }
.stp button { width: 32px; height: 30px; border: 0; background: #fff; font-size: 18px; line-height: 1; color: var(--carbon); padding: 0; }
.stp button:hover:not([disabled]) { background: var(--soft); }
.stp button:focus-visible { outline-offset: -2px; }
.stp button[disabled] { color: var(--grey); cursor: default; }
.stp output { min-width: 36px; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--carbon); font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.sw { position: relative; flex: none; width: 42px; height: 24px; border: 0; border-radius: 999px; background: #C9C9C7; padding: 0; transition: background .15s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(17,17,17,.3); transition: transform .15s; }
.sw.on { background: var(--orange); }
.sw.on i { transform: translateX(18px); }
.sw[disabled] { opacity: .4; cursor: default; }
.brow.col { flex-direction: column; align-items: stretch; gap: 7px; padding: 8px 0 10px; }
.cbopts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cbopt { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; text-align: left; line-height: 1.2; }
.cbopt b { font-size: 13px; font-weight: 700; color: var(--carbon); white-space: nowrap; }
.cbopt small { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.cbopt:hover { border-color: var(--carbon); }
.cbopt.on { background: var(--carbon); border-color: var(--carbon); }
.cbopt.on b { color: #fff; }
.cbopt.on small { color: rgba(255,255,255,.72); }
.cbopt.soon { background: var(--soft); border-style: dashed; cursor: not-allowed; }
.cbopt.soon:hover { border-color: var(--line2); }
.cbopt.soon b { color: rgba(58,58,58,.55); }
.soonpill { font-size: 8.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); background: #fff; border: 1px solid var(--orange); border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
.err .link { display: inline; margin-top: 4px; font-size: 12.5px; text-align: left; }
.bsub { margin-top: 14px; padding-bottom: 2px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
/* the code */
.codeview { display: flex; gap: 2px; margin-top: 8px; }
.codeview .cs { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 5px 2px 3px; border-radius: 4px; background: var(--soft); border-top: 3px solid var(--grey); }
.codeview .cs b { font-size: 15px; font-weight: 800; line-height: 1.15; color: var(--carbon); letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.codeview .cs i { font-style: normal; font-size: 8px; font-weight: 600; letter-spacing: .08em; color: var(--muted); line-height: 1.5; white-space: nowrap; }
.codeview .cs.pre { border-top-color: var(--carbon); }
.codeview .cs.kv, .codeview .cs.n { border-top-color: var(--orange); }
.codeview .cs.cb { border-top-color: var(--charcoal); }
.codeview .cs.l b { color: var(--charcoal); }
.codeview.big { gap: 3px; margin: 4px 0 10px; }
.codeview.big .cs { padding: 7px 2px 4px; }
.codeview.big .cs b { font-size: 18px; }
.codeview.big .cs i { font-size: 8.5px; }
.iname { margin: 8px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--carbon); font-weight: 600; }
.iname span { display: block; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.kpis span { background: var(--soft); border-radius: 6px; padding: 6px 8px 5px; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.kpis b { display: block; font-size: 16px; font-weight: 800; color: var(--carbon); letter-spacing: -0.01em; white-space: nowrap; }
.note.dc { margin: 10px 0 0; font-size: 12.5px; }
label.lbl { display: block; }
.codeform { display: flex; gap: 6px; margin-top: 6px; }
.codeform input { flex: 1; min-width: 0; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--carbon); text-transform: uppercase; background: #fff; }
.codeform input::placeholder { font-weight: 400; color: rgba(58,58,58,.45); }
.codeform input:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
.codeform input[aria-invalid="true"] { border-color: var(--orange); }
.err { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; color: #B23C04; font-weight: 600; }
.err[hidden] { display: none; }
/* line-up strip */
.strip { display: flex; flex-wrap: wrap; gap: 10px 8px; margin-top: 8px; }
.strip .sec { display: flex; flex-direction: column; gap: 4px; }
.strip .secl { font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid var(--orange); padding-bottom: 2px; white-space: nowrap; }
.strip .sec.cpl .secl { border-bottom-color: var(--charcoal); }
.strip .sec.srv .secl { border-bottom-color: var(--grey); }
.strip .chs { display: flex; flex-wrap: wrap; gap: 3px; }
.cub { width: 31px; height: 40px; padding: 0; border: 1px solid var(--line2); border-radius: 4px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.cub b { font-size: 14px; font-weight: 800; color: var(--carbon); }
.cub small { font-size: 8.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cub.t-I { background: var(--carbon); border-color: var(--carbon); }
.cub.t-I b { color: #fff; }
.cub.t-I small { color: rgba(255,255,255,.7); }
.cub.t-C, .cub.t-R { background: #F1F1EF; }
.cub.t-S { border-style: dashed; border-color: var(--charcoal); }
.cub:hover { border-color: var(--carbon); }
.cub.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--orange); }

/* tables + cards */
table.spec { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.spec th { text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--charcoal); padding: 8px 0 6px; border-bottom: 1.5px solid var(--carbon); }
table.spec th.cur { color: var(--orange); }
table.spec td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }

#pane { overflow: auto; padding: 20px 22px 32px; flex: 1; min-height: 0; }

.body { margin: 0 0 14px; }

/* learn steps */

.tc-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.dots { display: flex; gap: 3px; margin: 8px 0 2px; }

@media (prefers-reduced-motion: reduce) { .btn.nudge, #bline .r, .btag.in, .fxchip { animation: none; } }
details.toc { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px; }

/* viewport */
main.view { grid-area: view; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--stage); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.tip { position: absolute; pointer-events: none; background: var(--carbon); color: #fff; font-size: 12.5px; padding: 5px 9px; border-radius: 4px; z-index: 6; white-space: nowrap; transform: translate(14px, 14px); }

.titleblock .c:first-child { border-left: 0; }

.toast { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: var(--carbon); color: #fff; padding: 9px 14px; border-radius: 6px; font-size: 13px; z-index: 7; max-width: min(560px, 86%); }

.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; z-index: 1; }

/* ── operate mode: wide panel, builder hidden ── */

.oa-main { flex: 1; min-width: 0; }

.oa-steps .oa-k { letter-spacing: .12em; }
.oa-steps .btn.sm { padding: 4px 10px; font-size: 12px; }
.oa-steps li { counter-increment: st; background: #fff; border: 1px solid var(--line2); border-radius: 999px; padding: 1px 7px 1px 3px; font-size: 12px; font-weight: 600; color: var(--carbon); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.oa-steps li::before { content: counter(st); display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--carbon); color: #fff; font-size: 10.5px; font-weight: 700; }
.oa-steps li.target { border-color: var(--orange); }
.oa-steps li.target::before { background: var(--orange); }
.oa-steps .btn { margin-left: auto; }
@keyframes alertIn { 0% { transform: translateY(-5px); background: #FFD3BC; } 100% { transform: none; background: #FFF6F1; } }
@keyframes alertGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,92,26,0); } 50% { box-shadow: 0 0 0 6px rgba(232,92,26,.2); } }
.opgrid3 { display: grid; grid-template-columns: 128px minmax(0, 1fr) 188px; gap: 14px; align-items: start; }
.opgrid3.nomimic { grid-template-columns: minmax(0, 1fr) 220px; }
table.state td { padding: 4px 0; }
table.state .pill { font-size: 11px; padding: 1px 8px; }
table.state + .legend { margin: 6px 0 0; gap: 10px; font-size: 11px; flex-wrap: wrap; }
.mimic .mt.trip { fill: var(--orange); font-weight: 800; letter-spacing: .08em; }
.mimic .m-flash { fill: rgba(232,92,26,.16); stroke: var(--orange); stroke-width: 2; }
.fresh .mimic .m-flash { animation: blink .55s steps(2, jump-none) 5; }
.fresh .mimic .mg.flash { animation: blinkOp .55s ease-in-out 5; }
table.state tr.blk td { background: #FFF1E9; }
.fresh table.state tr.blk td { animation: rowFlash .55s ease-in-out 5; }
table.state tr.blk td:first-child { color: var(--orange); font-weight: 700; box-shadow: inset 3px 0 0 var(--orange); padding-left: 8px; }
.need { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--orange); white-space: nowrap; vertical-align: middle; }
.need svg { width: 11px; height: 11px; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: .15; } 100% { opacity: 1; } }
@keyframes blinkOp { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes rowFlash { 0%, 100% { background: #FFF1E9; } 50% { background: #FFD3BC; } }
.actcol { display: flex; flex-direction: column; gap: 5px; }
.actcol .lbl { margin-bottom: 1px; }
.btn.act { text-align: left; display: flex; align-items: center; gap: 7px; padding: 6px 10px; }
.btn.locked { background: #fff; color: var(--charcoal); border-color: var(--line2); border-style: dashed; }
.btn.locked:hover:not([disabled]) { background: #FFF6F1; border-color: var(--orange); color: var(--carbon); }
.btn.locked .lk { color: var(--orange); display: inline-flex; }
.btn.act.shake { animation: shake .4s ease-in-out; border-color: var(--orange); border-style: solid; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.body.small, .hint.small { font-size: 12.5px; color: var(--muted); }
.doorsec { margin-top: 12px; }
.doorsec .hint.small { margin-top: 6px; }
.doorhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.doorhead .live { color: var(--orange); }
.lrtag { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--carbon); }
.lrtag.rem { border-color: var(--orange); color: #fff; background: var(--orange); }
.lrtag.flash { box-shadow: 0 0 0 2px var(--orange); }
.fresh .lrtag.flash { animation: blink .55s steps(2, jump-none) 5; }
.doorwrap { background: #F3F3F2; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
svg.door { width: 100%; height: auto; display: block; }
#app.op svg.door { max-height: max(250px, calc(100vh - 584px)); }
svg.door .d-frame { fill: #B9BEC1; }
svg.door .d-face { fill: #DADDDB; stroke: #8E9499; stroke-width: 1.5; }
svg.door .d-hinge, svg.door .d-handle { fill: #2B2D2F; }
svg.door .q-slot { fill: #A7ADB1; }
svg.door .dl { fill: #1d1d1d; font-weight: 700; }
svg.door .dmut { fill: #666; font-weight: 400; }
svg.door .m-bezel { fill: #1d1f21; }
svg.door .m-face { fill: #F6F5F0; }
svg.door .m-arc { fill: none; stroke: #333; stroke-width: 1.6; }
svg.door .m-ticks line { stroke: #333; stroke-width: 1.4; }
svg.door .m-unit { fill: #222; font-weight: 700; }
svg.door .m-needle { stroke: #C62828; stroke-width: 2.4; stroke-linecap: round; transition: all .6s ease; }
svg.door .m-pivot { fill: #222; }
svg.door .m-read { fill: #6a6a6a; font-weight: 700; }
svg.door .m-read.live { fill: var(--carbon); }
svg.door .pm-lcd { fill: #1D2B24; }
svg.door .pm-cap { fill: #CFD8D2; font-weight: 600; }
svg.door .pm-val { fill: #8FF0B0; font-weight: 700; }
svg.door .pr-body { fill: #2C2F32; }
svg.door .pr-lcd { fill: #C9DCCF; }
svg.door .relay.tripped .pr-lcd { fill: #F6C9B4; }
svg.door .pr-title { fill: #1C2A22; font-weight: 800; }
svg.door .pr-status { fill: #1C2A22; font-weight: 700; }
svg.door .pr-cap { fill: #CFD2D4; font-weight: 600; }
svg.door .pr-screw { fill: #9AA0A4; }
svg.door .led-lit { filter: drop-shadow(0 0 4px currentColor); }
svg.door .ann-box { fill: #F2F2EE; stroke: #7D8388; stroke-width: 1.5; }
svg.door .ann-txt { fill: #222; font-weight: 700; }
svg.door .ann.lit .ann-box { fill: #FFC93E; stroke: #B07F00; }
svg.door .ann.lit { filter: drop-shadow(0 0 7px rgba(255,190,40,.85)); }
svg.door .bezel { fill: #C9CCCE; stroke: #6E7479; stroke-width: 1.5; }
svg.door .x { stroke: rgba(255,255,255,.28); stroke-width: 1.6; }
svg.door .halo { opacity: .28; }
svg.door .lamp.lit circle[r="11"] { filter: drop-shadow(0 0 5px rgba(255,255,255,.4)); }
svg.door .shine { fill: rgba(255,255,255,.75); }
svg.door .shine2 { fill: rgba(255,255,255,.35); }
svg.door .blank { fill: #E3E5E4; stroke: #8A9095; stroke-width: 1.5; }
svg.door .sel-body, svg.door .vs-body { fill: #D4D7D9; stroke: #4D5155; stroke-width: 1.5; }
svg.door .sel-bar { fill: #2A2A2A; transition: transform .25s ease; }
svg.door .pos { fill: #777; font-weight: 700; }
svg.door .pos.on { fill: var(--orange); }
svg.door .hot { cursor: pointer; }
svg.door .hot:hover .bezel, svg.door .hot:hover .sel-body { stroke: var(--orange); stroke-width: 3; }
svg.door .hot:focus { outline: none; }
svg.door .hot:focus-visible .bezel, svg.door .hot:focus-visible .sel-body { stroke: var(--orange); stroke-width: 4; }
svg.door .pb.pressed { animation: press .25s ease-out; transform-box: fill-box; }
@keyframes press { 50% { opacity: .55; } }
svg.door .flash-ring { fill: none; stroke: var(--orange); stroke-width: 4; }
.fresh svg.door .flash-ring { animation: blink .55s steps(2, jump-none) 5; }
.fresh svg.door .flash { animation: blinkOp .55s ease-in-out 5; }
svg.door .callout { pointer-events: none; }
.fresh svg.door .callout { animation: calloutIn .35s cubic-bezier(.2,.8,.2,1); transform-box: fill-box; transform-origin: 50% 100%; }
svg.door .callout rect, svg.door .callout path { fill: var(--orange); }
svg.door .callout text { fill: #fff; font-weight: 700; }
svg.door .remote-note { fill: var(--orange); font-weight: 700; letter-spacing: .02em; }
@keyframes calloutIn { from { transform: scale(.85); } to { transform: none; } }
.optools { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 12px; }
.optools .chips, .optools .btnrow.tight { margin-top: 6px; }
.chip.sim.on { border-color: var(--orange); color: var(--orange); font-weight: 600; }
.chip[disabled] { opacity: .45; }

/* viewport banner for blocked operations */
.bbanner[hidden] { display: none; }
.bbanner { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 8; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--orange); border-radius: 10px; padding: 12px 12px 12px 14px; width: min(600px, calc(100% - 24px)); box-shadow: 0 10px 28px rgba(17,17,17,.14); }
.bbanner.in { animation: bannerIn .4s cubic-bezier(.2,.8,.2,1); }
.bbanner .bb-ico { display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--orange); color: #fff; }
.bbanner .bb-ico svg { width: 16px; height: 16px; }
.bb-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.bb-k { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
.bb-txt strong { font-size: 18px; font-weight: 800; color: var(--carbon); letter-spacing: -0.015em; line-height: 1.2; }
.bb-txt strong em { font-style: normal; font-weight: 300; color: var(--charcoal); }
.bb-why { font-size: 14px; font-weight: 600; color: var(--carbon); line-height: 1.4; }
.bb-rule { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.bb-rule b { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--charcoal); margin-right: 4px; }
.bb-where { font-size: 12.5px; color: var(--orange); font-weight: 700; line-height: 1.4; }
.bbanner .bb-x { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 0 2px; color: var(--charcoal); align-self: flex-start; }
@keyframes bannerIn { from { transform: translate(-50%, -12px); box-shadow: 0 0 0 8px rgba(232,92,26,.25); } to { transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) {
  .opalert.blocked, .fresh .mimic .m-flash, .fresh .mimic .mg.flash, .fresh table.state tr.blk td, .fresh svg.door .flash-ring, .fresh svg.door .flash, .fresh svg.door .callout, .fresh .lrtag.flash, .bbanner.in, .btn.act.shake { animation: none !important; }
}

@media (max-width: 1360px) {
  #app.op { grid-template-columns: 0 minmax(0, 1fr) 600px; }
  .opgrid3 { grid-template-columns: 116px minmax(0, 1fr) 172px; gap: 12px; }
  .ophead .field { min-width: 220px; }
}
/* short screens (laptops at 768-860 px): tighten the operate pane so the LV door stays in view */
@media (max-height: 860px) and (min-width: 981px) {
  #app.op #pane { padding-top: 10px; }
  .ophead { margin-bottom: 6px; }
  .opalert { min-height: 0; padding-top: 7px; padding-bottom: 7px; }
  .opalert.blocked { padding-top: 7px; padding-bottom: 8px; }
  .opgrid3 { grid-template-columns: 108px minmax(0, 1fr) 184px; }
  table.state td { padding: 2px 0; }
  table.state + .legend { display: none; }
  .actcol { gap: 4px; }
  .btn.act { padding: 5px 10px; }
  .doorsec { margin-top: 8px; }
  .doorhead { margin-bottom: 4px; }
  #app.op svg.door { max-height: max(230px, calc(100vh - 486px)); }
}
@media (max-width: 1180px) {
  #app { grid-template-columns: 260px minmax(0, 1fr) 340px; }
  #app.op { grid-template-columns: 0 minmax(0, 1fr) 540px; }
  .brand { padding-right: 14px; }
  .ttl .lbl { display: none; }
}
@media (max-width: 980px) {
  #app, #app.op { height: auto; min-height: 100vh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh auto auto; grid-template-areas: "head" "view" "left" "right"; }
  .opgrid3 { grid-template-columns: 130px minmax(0, 1fr); }
  .opgrid3 .actcol { grid-column: 1 / -1; }
  .opgrid3.nomimic { grid-template-columns: minmax(0, 1fr); }
  .alertslot { position: static; margin: 0 0 10px; padding: 0; background: none; }
  #app.op svg.door { max-height: none; }
  .oa-why { display: block; }
  .bbanner { top: 12px; }
  header.top { flex-wrap: wrap; padding: 10px 16px; gap: 12px 16px; }
  .brand { border-right: 0; padding: 6px 0; }
  .spacer { display: none; }
  aside.left, aside.right { border: 0; border-top: 1px solid var(--line); }
  aside.left { padding: 18px 16px; overflow: visible; }
  #pane { overflow: visible; padding: 18px 16px 28px; }
  .titleblock, .hint2 { display: none; }
  .tb.tr { top: auto; bottom: 12px; right: 12px; left: 12px; }
  .pop { right: auto; left: 0; width: min(340px, calc(100vw - 32px)); }
}
@media (max-width: 520px) {
  .tb.tl .seg button, .tb.tr .seg button { padding: 5px 8px; font-size: 12px; }
  .tog { padding: 5px 9px; font-size: 12px; }
  .codeview .cs b { font-size: 14px; }
}
</style>

["vcb","truck","spout","shutter","ct","crossbus","busbar","lv"]},R:{name:"Bus riser",short:"BR",field:"C",generic:!0,blurb:"Carries the coupler\u2019s cross-bus back up to the second busbar section.",body:"Fixed copper risers, no switching device. It always comes with the coupler: C1 in the code adds both. Internals are indicative until the riser drawing is added.",keys:["riser","crossbus","busbar","blank","lv"]},S:{name:"Service panel",short:"SRV",field:"S",generic:!0,blurb:"A load-break-switch panel at the end of the line-up.",body:"S in the 7th position of the code adds it at the end of the line-up. Internals (load-break switch, fuses, terminations) are indicative until the service-panel drawing is added.",keys:["lbs","fuse","lbsmech","cable","busbar","lv"]}},Oa={12:[["Rated voltage","12 kV"],["Power-frequency withstand (1 min)","28 kV"],["Lightning impulse (BIL)","75 kV"],["Rated frequency","50 Hz"],["Rated current, busbar & breakers","1250 A"],["Breaking current","31.5 kA"],["Short-time withstand","31.5 kA / 3 s"],["Peak withstand","80 kA"],["Degree of protection","IP 4X (min.)"],["Cubicle W \xD7 D \xD7 H","800 \xD7 1450 \xD7 2231 mm"],["Overall, with top hood and doors","800 \xD7 1560 \xD7 2311 mm"],["Breaker","ABB VD4, withdrawable"]],24:[["Rated voltage","24 kV"],["Power-frequency withstand (1 min)","50 kV"],["Lightning impulse (BIL)","125 kV"],["Rated frequency","50 Hz"],["Rated current, busbar & breakers","1250 A"],["Breaking current","25 kA"],["Short-time withstand","25 kA / 3 s"],["Peak withstand","62.5 kA"],["Degree of protection","IP 4X (min.)"],["Cubicle W \xD7 D \xD7 H","1000 \xD7 1800 \xD7 2364 mm"],["Overall, with top hood and doors","1000 \xD7 1936 \xD7 2446 mm"],["Breaker","ABB VD4, withdrawable"]],source:"PL-MVSG-CB-SPEC Rev. 4 (EEHC EDMS 01-100-1 / 01-200-1) \xB7 GA drawings PLGEAR12901 / PLGEAR24901 \xB7 PLGEAR coding reference \xA76"},pi={enclosure:{name:"Cell enclosure",area:"Whole cell",label:"Enclosure",ask:"How big is one cell?",answer:"800 mm wide at 12 kV, 1000 mm at 24 kV.",body:"A bolted sheet-steel cell, split into four compartments by earthed metal partitions. Cells bolt side by side into a line-up and the main busbar runs through all of them.",specs:[["Cell width","800 mm","1000 mm"],["Overall height (with roof plates)","2311 mm","2446 mm"],["Overall depth","1560 mm","1936 mm"],["Frame depth","1452 mm","1800 mm"],["Weight, 3-cell line-up (I + 2 O)","1870.52 kg","2888.29 kg"],["Weight per cell (average)","\u2248 624 kg","\u2248 963 kg"],["Degree of protection","IP 4X (min.)","IP 4X (min.)"],["Drawing","PLGEAR12901","PLGEAR24901"],["General tolerances","DIN ISO 2768-m","DIN ISO 2768-m"]],source:"GA drawings PLGEAR12901 / PLGEAR24901 \xB7 IP rating: PL-MVSG-CB-SPEC Rev. 4"},partition:{name:"Compartments & partitions",area:"Whole cell",label:"Partitions",ask:"Why split a cell into four compartments?",answer:"So a fault or a maintenance job in one stays out of the others.",body:"Earthed metal partitions separate the LV, circuit-breaker, busbar and cable compartments. The spouts pass through the vertical partition between the breaker and the busbar / cable side.",specs:[["LV compartment","Front, top","Front, top"],["Circuit-breaker compartment","Front, middle","Front, middle"],["Busbar compartment","Rear, top","Rear, top"],["Cable compartment","Rear, bottom","Rear, bottom"],["Lower front compartment","VTs (incoming cell)","VTs (incoming cell)"],["Compartment heights, LV / CB / cable","615 / 770 / 730 mm","507 / 1003 / 750 mm"]],source:"Side-section views, GA drawings PLGEAR12901 / PLGEAR24901 \xB7 PLGEAR coding reference \xA76"},doors:{name:"Front doors",area:"Front",label:"Front doors",ask:"Can you open the breaker door while the breaker is in Service?",answer:"No. The door stays locked until the truck is back in Test.",body:'Three pressed-steel front doors on external black hinges. Each face is flat right up to its top and bottom edges; only the two vertical sides bend back to the door edge. Between the doors a strip of the galvanised front frame shows. LV door: meters, relay, alarm windows, pilot lamps and push buttons on black legend plates, two quarter-turn locks on the right-hand strip. Breaker door: a "VCB 1250A" label plate at the top, a window onto the breaker\u2019s Push OFF / Push ON buttons and position indicator, the earthing-switch operating port with a padlockable shutter, and a lever handle on the right-hand strip. Cable-compartment door: observation window, bilingual Electrical Hazard sign, screw locks and emergency unlock; the rear-door interlock instruction plate sits on the frame strip above it. At the rear, two hinged covers; the lower one is the cable door, interlocked with the earthing switch.',specs:[["Door zones incl. frame strips, top \u2192 bottom","731 / 770 / 730 mm","613 / 1003 / 750 mm"],["Construction","Pressed steel, flat face, both sides bent back, external hinges","Pressed steel, flat face, both sides bent back, external hinges"],["Breaker door","VCB label plate \xB7 window \xB7 ES port \xB7 lever handle","VCB label plate \xB7 window \xB7 ES port \xB7 lever handle"],["Breaker door interlock","Close + lock","Close + lock"],["Earthing switch operation","Manual, door closed, padlockable port","Manual, door closed, padlockable port"],["Cable-compartment door","Window \xB7 danger sign \xB7 emergency unlock","Window \xB7 danger sign \xB7 emergency unlock"],["Rear covers","2, hinged; lower interlocked with the ES","2, hinged; lower interlocked with the ES"],["Top hood","On the frame top, above the LV door \xB7 PLGEAR12 + logo","On the frame top, above the LV door \xB7 PLGEAR24 + logo"]],source:"Front views, GA drawings \xB7 PL-MVSG-CB-SPEC Rev. 4 \xA73, \xA76 \xB7 factory photos of a PLGEAR12 cell (LV door to the frame top, hood above it)"},roof:{name:"Roof plates",area:"Roof",label:"Roof plates",ask:"Where does the pressure go if an internal arc happens?",answer:"Up, through the removable internal-arc plates in the roof, away from the operator at the front.",body:"Each cell\u2019s roof carries removable internal-arc plates and perforated ventilation plates over the compartments (see the top views on the GA drawings).",specs:[["Main plate width","640 mm","860 mm"],["Height above frame","79.5 mm","80 mm"],["Plate types","Internal-arc removable + ventilation","Internal-arc removable + ventilation"]],source:"Top views, GA drawings PLGEAR12901 / PLGEAR24901"},busbar:{name:"Main busbar",area:"Busbar compartment",label:"Main busbar",ask:"How does power travel along the line-up?",answer:"On copper main busbars that run through every cell.",body:"Three phases run the full length of the line-up at the rear of the busbar compartment and pass from cell to cell through side-wall bushings. At 12 kV the phases are stacked vertically; at 24 kV they sit in a triangle.",specs:[["Bar section","Cu 80 \xD7 10 mm","Cu 120 \xD7 10 mm"],["Bars per cell","6 (2 per phase)","3 (1 per phase)"],["Bar length per cell","800 mm (holes at 761 mm)","1140 mm"],["Phase arrangement","Vertical stack","Triangle, 2 top + 1 below"]],source:"Busbar sheet: PLGEAR12901 p.4 (part 1) / PLGEAR24901 p.3 (part 1)"},bushing:{name:"Side-wall bushing",area:"Busbar compartment",label:"Side-wall bushing",ask:"How does the busbar get through the side walls?",answer:"Through cast-epoxy side-wall bushings, one per phase in every wall.",body:"The bushing insulates the busbar from the earthed side wall, so each cell\u2019s busbar compartment stays closed off from its neighbour.",specs:[["Rated / highest voltage Um","12 kV","24 kV"],["Power-frequency withstand Ud (1 min, dry)","28 kV rms","50 kV rms"],["Lightning impulse BIL (1.2/50 \xB5s)","75 kV peak","125 kV peak"],["Rated frequency","50 Hz","50 Hz"],["Rated normal current","630 / 1250 / 1600 / 2000 / 2500 / 3150 A (per design)","Feeder 630\u20132000 A \xB7 busbar up to 4000 A"],["Short-time withstand Ik","25 or 31.5 kA / 3 s","31.5 kA / 4 s"],["Peak withstand Ip","63 / 80 kA peak","80 kA peak"],[ [qn(n),n.upperTerm-30,-(n.p1-30)],1800,260,900),focus:"vcb",onTruck:!0,at:n=>[qn(n),n.upperTerm,-(n.arm-n.tulipLen/2)],text:"In Service the breaker\u2019s tulip contacts close around the fixed contacts, so the breaker plugs in and out without unbolting anything.",tag:["Tulip contacts","on the breaker arms"]},{t:"Current path",view:"xray",shot:(n,e)=>[[-2600*e,n.H*.92,1700*e],[n.W/2,n.H*.5,-n.D*.5]],act:"path:full",focus:"spout",text:"Follow the current between the main busbar and the cable: upper spout, through the breaker, lower spout and the CTs.",tag:["Current path","busbar \u21C4 breaker \u21C4 cable"]}]},{title:"Shutters",key:"shutter",cell:"feeder",view:"section",cam:"spouts",doors:!1,ask:"What covers the live contacts when the breaker is out?",answer:"Metal shutters that close automatically as the truck racks out.",body:()=>"The truck drives the side levers: the upper shutter (busbar side) and the lower one (cable side) close over the spouts as it racks out.",facts:n=>[["2","plates: busbar side + cable side"],[bt(n)?"792 \xD7 775":"981 \xD7 998","assembly W \xD7 H, mm"],["Truck","drives the side levers"]],beats:[{t:"Two plates",shot:"spouts",focus:"shutter",text:"The upper plate (INPUT) covers the busbar-side spouts and the lower one (OUTPUT) the cable side.",tag:["Shutter","INPUT above, OUTPUT below"]},{t:"Rack out",shot:xt(n=>[n.W/2,(n.upperTerm+n.lowerTerm)/2,-(n.p1-40)],2700,300,1400),act:"rackOut",focus:"shutter",text:"As the truck racks out to Test, levers on both sides drive the plates together over the spouts.",tag:["Shutters closing","driven by the truck"]},{t:"Spouts covered",shot:xt(n=>[n.W/2,(n.upperTerm+n.lowerTerm)/2,-(n.p1-20)],1900,220,800),act:"rackOut",orbit:14,focus:"shutter",text:"With the breaker out, the live spouts sit behind closed metal shutters.",tag:["Shutters closed","breaker in Test"]},{t:"Rack in",shot:xt(n=>[n.W/2,(n.upperTerm+n.lowerTerm)/2,-(n.p1-40)],2700,300,1400),act:"rackIn",focus:"shutter",text:"Racking back in opens them again, only as the tulip contacts arrive.",tag:["Shutters open","breaker in Service"]}]},{title:"Circuit breaker",key:"vcb",cell:"feeder",view:"xray",cam:"cb",doors:!1,ask:"What interrupts the fault current?",answer:(n,e)=>e.cb==="PL"?"The Powerline withdrawable vacuum breaker (PL in the code).":"The ABB VD4 vacuum breaker (AB in the code).",body:(n,e)=>e.cb==="PL"?`1250 A, ${n.kv===12?"31.5":"25"} kA for 3 s, vacuum interrupters, withdrawable truck. The 3D breaker is drawn to the current frame size until the Powerline VCB drawing is added.`:n.kv===12?"VD4 12.12.32 p210: 1250 A, 31.5 kA, 210 mm pole pitch, 75 kg. Spring mechanism, 110 V coils, M2 endurance (10 000 operations).":"VD4 24.12.25 p275: 1250 A, 25 kA, 275 mm pole pitch, 104 kg. Spring mechanism, 110 V coils, M2 endurance (10 000 operations).",facts:(n,e)=>e.cb==="PL"?[["1250 A","rated current"],[bt(n)?"31.5 kA":"25 kA","breaking current"],["3 s","short-time withstand"],["Vacuum","interruption, no SF6"]]:[["1250 A","rated current"],[bt(n)?"31.5 kA":"25 kA","breaking current"],["33\u201360 ms","opening time"],["10 000","operations, class M2"]],beats:[{t:"Three poles",shot:Yn(n=>[n.W/2,n.truckTop+n.vcb.H/2,-(n.zTest+n.stroke+n.poleZ)],1300,450,1500),focus:"vcb",onTruck:!0,at:n=>[n.W/2,n.truckTop+70+(n.vcb.H-70)/2,-n.poleZ],text:(n,e)=>e.cb==="PL"?"Three insulated poles, one per phase, each with a vacuum interrupter: the arc is put out in vacuum, with no SF6.":`Three embedded epoxy poles, one per phase, each with a vacuum interrupter, ${n.vcb.P} mm apart.`,tag:["Poles","vacuum interrupters"]},{t:"Mechanism",shot:Yn(n=>[n.W/2,n.truckTop+n.mechH/2,-(n.zTest+n.stroke)],500,120,1400),focus:"vcb",onTruck:!0,at:n=>[n.W/2,n.truckTop+n.mechH/2,-5],text:(n,e)=>e.cb==="PL"?"At the front, the operating mechanism opens and closes the contacts. The door window shows its Push ON / Push OFF buttons and the position indicator.":"At the front, a stored-energy spring mechanism with 110 V coils opens and closes the contacts. The door window shows its Push ON / Push OFF buttons and the position indicator.",tag:["Operating mechanism","Push ON / OFF \xB7 indicator"]},{t:"Protection trip",view:"solid",shot:Yn(n=>[n.W/2,n.truckTop+n.mechH/2,26],350,80,1300),act:"trip",focus:null,onTruck:!0,at:n=>[n.W/2,n.truckTop+n.mechH/2,-5],text:(n,e)=>e.cb==="PL"?"Watch the indicator through the window: a protection trip opens the breaker, and the trip stays latched until it is reset.":"Watch the indicator through the window: a protection trip opens the breaker in 33\u201360 ms, and the trip stays latched until it is reset.",tag:["Tripped","indicator shows O"]},{t:"Reset and close",view:"solid",shot:Yn(n=>[n.W/2,n.truckTop+n.mechH/2,26],350,80,1300),act:"resetClose",orbit:10,focus:null,onTruck:!0,at:n=>[n.W/2,n.truckTop+n.mechH/2,-5],text:"After Reset the breaker closes again: the indicator shows I and the ON lamp lights on the LV door.",tag:["Closed","indicator shows I"]}]},{title:"Racking",key:"truck",cell:"feeder",view:"section",cam:"side",doors:!1,ask:"How far does the breaker travel?",answer:"200 mm at 12 kV, 300 mm at 24 kV, from Test to Service.",body:n=>`It runs on ${n.rail} mm guide rails. The same assembly (${n.railAsm} mm overall) carries the shaft that interlocks the earthing switch with the truck.`,facts:n=>[[`${n.stroke} mm`,"Test \u2194 Service stroke"],[`${n.rail} mm`,"guide rails"],[`${n.railAsm} mm`,"rails + ES interlock shaft"],["Close + lock","breaker-door interlock"]],beats:[{t:"Service",shot:"side",focus:"truck",onTruck:!0,at:n=>[n.W/2,(n.cbFloor+n.truckTop)/2,-n.truckD/2],text:"In Service the truck is racked in and the breaker is plugged into the spouts.",tag:["Truck","Service position"]},{t:"Rack out",shot:xt(n=>[n.W/2,n.cbFloor+260,-(n.zTest+n.stroke/2+n.truckD/2)],3e3,400,1300),act:"rackOut",focus:"truck",onTruck:!0,at:n=>[n.W/2,(n.cbFloor+n.truckTop)/2,-n.truckD/2],text:n=>`The breaker opens first, then the racking drive moves the truck ${n.stroke} mm forward to Test along its ${n.rail} mm guide rails.`,tag:["Racking",n=>`${n.stroke} mm stroke`]},{t:"Test",shot:xt(n=>[n.W/2,n.cbFloor+260,-(n.zTest+n.truckD/2)],2300,300,900),act:"rackOut",orbit:16,focus:"truck",onTruck:!0,at:n=>[n.W/2,(n.cbFloor+n.truckTop)/2,-n.truckD/2],text:"In Test the primary circuit is isolated, but the secondary plug stays connected, so the breaker can still be tested.",tag:["Test position","primary isolated"]},{t:"Rack in",shot:xt(n=>[n.W/2,n.cbFloor+260,-(n.zTest+n.stroke/2+n.truckD/2)],3e3,400,1300),act:"rackIn",focus:"truck",onTruck:!0,at:n=>[n.W/2,(n.cbFloor+n.truckTop)/2,-n.truckD/2],text:"Racking needs the breaker door closed, and the door stays locked while the truck is in Service.",tag:["Door interlock","close + lock"]}]},{title:"Current transformers",key:"ct",cell:"feeder",view:"section",cam:"cable",doors:!1,ask:"Where is the current measured?",answer:"On the cable side, by one cast-resin CT per phase.",body:()=>"Ratio, class and burden come from the project\u2019s protection study, not from the cell design.",facts:()=>[["3","per feeder, one per phase"],["Cast resin","insulation"],["Per study","ratio, class and burden"]],beats:[{t:"One per phase",shot:"cable",focus:"ct",text:"Three cast-resin CTs sit on the cable side of the breaker, one per phase.",tag:["Current transformer","3 per feeder"]},{t:"Current through",shot:xt(n=>[qn(n),(n.ct.y0+n.ct.y1)/2,-n.ct.z],2300,250,900),act:"path:ct",focus:"ct",text:"The primary current passes through each CT on its way between the breaker and the cable.",tag:["Primary current","through each CT"]},{t:"To the relay",shot:xt(n=>[qn(n),(n.ct.y0+n.ct.y1)/2,-n.ct.z],1700,300,700),orbit:16,focus:"ct",text:"The CT secondaries feed the PR protection relay and the ammeters on the LV door. Ratio, class and burden come from the protection study.",tag:["CT secondaries","to the PR relay and ammeters"]}]},{title:"Earthing switch",key:"es",cell:"feeder",view:"section",cam:"cable",doors:!1,ask:"How is the cable made safe to touch?",answer:"Close the earthing switch. It only closes with the truck in Test.",body:n=>`3-pole, making capacity ${n.kv===12?"80":"62.5"} kA (class E2), mechanical class M1 (2000 operations). It sits on the cable side of the CTs and is operated manually with the door closed.`,facts:n=>bt(n)?[["80 kA","making capacity, class E2"],["25 / 31.5 kA","short-time, 1 s"],["2000","operations, class M1"]]:[["62.5 kA","making capacity, class E2"],["25 kA","short-time, 1 s"],["2000","operations, class M1"]],beats:[{t:"Cable side",shot:"cable",focus:"es",text:"A 3-pole earthing switch on the cable side of the CTs, operated by hand from the front with the door closed.",tag:["Earthing switch","3-pole, cable side"]},{t:"Rack out first",shot:"side",act:"rackOut",focus:"es",text:"It can only close with the truck in Test: the interlock shaft along the guide rails blocks it in Service.",tag:["Interlock","truck must be in Test"]},{t:"Close",shot:xt(n=>[qn(n),n.es.insY-60,-(n.es.pivot.z+60)],1800,250,800),act:"esClose",orbit:12,focus:"es",text:n=>`The blades swing onto the fixed earth contacts: the cable is earthed and ES ON lights on the door. Making capacity ${bt(n)?"80":"62.5"} kA, class E2.`,tag:["Earthed",n=>`making ${bt(n)?"80":"62.5"} kA, class E2`]},{t:"Back to service",shot:"cable",act:"service",focus:"es",text:"Open it again, rack in and close: the cubicle is back in service. Class M1 means 2000 mechanical operations.",tag:["Open","class M1, 2000 operations"]}]},{title:"Surge arresters & cables",key:"sa",cell:"feeder",view:"section",cam:"cable",doors:!1,ask:"What protects the cable from overvoltage?",answer:"Surge arresters, one per phase, at the cable end.",body:()=>"The cables enter from below into the rear cable compartment and land on the connection bar with bolted lugs.",facts:()=>[["3","surge arresters per feeder"],["Bottom","cable entry"],["1 per phase","single-core cable, as modelled"]],beats:[{t:"Surge arresters",shot:xt(n=>[qn(n),24+n.saH/2,-n.saZ],2200,300,800),focus:"sa",tex comer, so they measure the incoming supply.",tag:["VT connection","cable side of the incomer"]},{t:"What they feed",view:"solid",shot:Yn(n=>[n.W/2,(n.doors.lv[0]+n.H)/2,26],600,100,1900),focus:null,at:n=>[n.W/2,(n.doors.lv[0]+n.H)/2+60,30],text:"They step the voltage down for the PR protection relay, the PM power meter and the voltmeter with its selector on the incomer\u2019s door.",tag:["Incomer LV door","PM \xB7 V with selector"]}]},{title:"LV compartment",key:"lv",cell:"feeder",view:"solid",cam:"front",doors:!1,ask:"Where do protection and control live?",answer:"In the LV compartment, segregated from every MV part.",body:()=>"The LV door carries the protection relay, ammeters, alarm windows, position lamps and the ON / OFF push buttons with an L/R selector. Behind it: MCBs and terminals. The breaker plugs in through a 58-pin aviation plug.",facts:()=>[["58-pin","breaker secondary plug"],["110 V","DC / AC coils and motor"],["4 NO + 4 NC","auxiliary contacts, min."],["L / R","local / remote selector"]],beats:[{t:"On the door",view:"solid",shot:Yn(n=>[n.W/2,(n.doors.lv[0]+n.H)/2-30,26],700,150,2100),focus:null,at:n=>[n.W/2,(n.doors.lv[0]+n.H)/2+60,30],text:"The LV door carries the protection relay, ammeters, alarm windows, position lamps and the ON / OFF push buttons with an L/R selector.",tag:["LV door","relay \xB7 meters \xB7 lamps"]},{t:"Live lamps",view:"solid",shot:Yn(n=>[n.W/2-60,n.doors.lv[0]+.32*(n.H-n.doors.lv[0]),30],300,80,1150),act:"lamps",focus:null,at:n=>[n.W/2-60,n.doors.lv[0]+.32*(n.H-n.doors.lv[0]),30],text:"The lamps follow the breaker: watch ON and OFF swap as it opens and closes again.",tag:["Position lamps","ON \xB7 OFF \xB7 Trip \xB7 ES \xB7 CB"]},{t:"Behind the door",view:"solid",shot:Yn(n=>[n.W/2,n.H-260,-(n.lvZ-80)],1300,150,1300),act:"lvOpen",focus:"lv",at:n=>[n.W/2,n.H-270,-(n.lvZ-80)],text:"Behind it: MCBs, terminals and wiring, segregated from every MV part by earthed steel.",tag:["MCBs and terminals","low voltage only"]},{t:"Breaker wir
